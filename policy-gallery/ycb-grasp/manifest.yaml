name: ycb-grasp
version: 0.3.0
title: Grasp YCB objects with the left hand
description: |
  One LW-v0 workstation in the viewer. Pick an object, drop it anywhere on the left half of
  the table, press Grasp: the left arm and hand pick it up and hold it 15 cm up. The policy
  looks once at the object (512 points on its surface, its pose, the robot's state) and
  corrects a recorded grasp demonstration: where the palm goes, how it is turned, how far
  each finger closes. The grasp then runs open loop, within the real controller's limits.

  Objects: 31 YCB objects (cans, boxes, bottles, fruit, ten stacking cups, balls, a mug,
  a foam brick, a padlock, a Rubik's cube), each dropped in one of its resting poses at
  random, at a random spot in the region the policy was trained on (x 0.2-0.62 m,
  y 0-0.56 m). None of them was among the 3,200 training objects; they and their poses are
  the ones the training repository's evaluation over that region found grasped in at least
  95% of trials. Thin and flat objects (cutlery, markers, dice, screwdrivers) and the bowl
  are not grasped reliably yet.

  Policy: a PointNet actor, trained with one-step PPO on 3,200 objects placed anywhere in
  that region, for 2,000 updates (12.8 million episodes) on this version of LW-v0.
license: |
  Policy weights: research use only (non-commercial). Trained on DexGraspNet objects
  (CC BY-NC 4.0).
  Objects: YCB Object and Model Set, CC BY 4.0 (Calli et al., "The YCB Object and Model
  Set", IEEE Robotics & Automation Magazine, 2015).
