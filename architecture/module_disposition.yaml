layers:
  order:
    - foundation
    - domain
    - configuration
    - numerical_backend
    - isaac_infrastructure
    - outputs
    - product
    - product_interface
    - training
  path_owners:
    linkerbot_sim.configuration: configuration
    linkerbot_sim.backends: numerical_backend
    linkerbot_sim.isaac: isaac_infrastructure
    linkerbot_sim.mirror: product
    linkerbot_sim.kaleidoscope: product
    linkerbot_sim.training: training
  dependency_rules:
    - name: configuration_is_pure
      source_prefix: linkerbot_sim.configuration
      forbidden_import_prefixes:
        - torch
        - gymnasium
        - skrl
        - newton
        - mujoco_warp
        - omni
        - isaacsim
        - linkerbot_sim.app
        - linkerbot_sim.isaac
        - linkerbot_sim.mirror
        - linkerbot_sim.kaleidoscope
        - linkerbot_sim.training
    - name: isaac_does_not_depend_on_products
      source_prefix: linkerbot_sim.isaac
      forbidden_import_prefixes:
        - linkerbot_sim.mirror
        - linkerbot_sim.kaleidoscope
        - linkerbot_sim.training
    - name: numerical_backends_do_not_depend_on_products
      source_prefix: linkerbot_sim.backends
      forbidden_import_prefixes:
        - linkerbot_sim.mirror
        - linkerbot_sim.kaleidoscope
        - linkerbot_sim.training
    - name: mirror_does_not_depend_on_kaleidoscope
      source_prefix: linkerbot_sim.mirror
      forbidden_import_prefixes:
        - linkerbot_sim.kaleidoscope
        - linkerbot_sim.training
    - name: kaleidoscope_has_no_mirror_or_excluded_services
      source_prefix: linkerbot_sim.kaleidoscope
      forbidden_import_prefixes:
        - linkerbot_sim.mirror
        - linkerbot_sim.planning
        - linkerbot_sim.telemetry
        - linkerbot_sim.logging
        - linkerbot_sim.sensors.camera
        - linkerbot_sim.backends.curobo.collision
        - linkerbot_sim.backends.curobo.planning
        - newton
        - mujoco_warp
    - name: training_uses_only_public_kaleidoscope_port
      source_prefix: linkerbot_sim.training
      forbidden_import_prefixes:
        - linkerbot_sim.isaac
        - linkerbot_sim.mirror
        - linkerbot_sim.kaleidoscope.

# 下列 facade 导出已经冻结。生成器同时解析源码 ``__all__``，任何新增、删除或改名都必须
# 先进行显式架构评审并同步中英文 API 文档，不能把 implementation helper 顺手公开。
public_facades:
  linkerbot_sim:
    freeze_status: frozen
    runtime: pure
    exports: [REPO_ROOT, __version__]
  linkerbot_sim.configuration:
    freeze_status: frozen
    runtime: pure
    exports:
      - MirrorConfig
      - KaleidoscopeConfig
      - KaleidoscopeEnvironmentSettings
      - KaleidoscopeViewportSettings
      - ComputeSettings
      - NewtonCpuSettings
      - NewtonCudaSettings
      - PhysicsEngine
      - PhysicsExecution
      - PhysicsSettings
      - PhysxCpuSettings
      - PhysxCudaSettings
      - SkrlTrainingSettings
      - load_mirror_config
      - load_kaleidoscope_config
      - load_kaleidoscope_viewport_config
      - load_skrl_training_settings
      - semantic_config_payload
      - semantic_config_fingerprint
  linkerbot_sim.mirror:
    freeze_status: frozen
    runtime: pure
    exports:
      - MirrorConfig
      - MirrorRuntime
      - MirrorController
      - create_mirror_runtime
      - run_mirror
  linkerbot_sim.kaleidoscope:
    freeze_status: frozen
    runtime: pure
    exports:
      - ControlModeChange
      - ControlModeGenerationConflict
      - ControlModeIncompatibleError
      - ControlModeLockedError
      - ControlModeRollbackError
      - ControlModeState
      - ControlModeSwitchError
      - KaleidoscopeConfig
      - TorchKaleidoscopeEnv
      - GymnasiumKaleidoscopeAdapter
      - KaleidoscopeEpisodeSnapshot
      - KaleidoscopeTrainingPort
      - make_torch_env
      - make_viewport_env
      - make_gymnasium_env
      - register_gymnasium_envs
  linkerbot_sim.training.skrl:
    freeze_status: frozen
    runtime: pure
    exports:
      - SkrlTorchAdapter
      - FinalObservationPPO
      - CudaRolloutMemory
      - make_skrl_trainer
  linkerbot_sim.snapshots:
    freeze_status: frozen
    runtime: pure
    exports:
      - SceneSnapshot
      - load_scene_snapshot
      - save_scene_snapshot
      - validate_scene_snapshot
  linkerbot_sim.backends.curobo:
    freeze_status: frozen
    runtime: pure
    exports:
      - CuroboConfig
      - CuroboContext
      - CuroboDeviceBatchIKSolver
      - CuroboKinematicsContext
      - curobo_config_from_profiles
      - create_kinematics_context

