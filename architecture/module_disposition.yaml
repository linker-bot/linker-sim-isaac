legacy_retirement:
  scan_roots:
    - root: src/linkerbot_sim
      suffixes: [.py]
    - root: configs
      suffixes: [.yaml, .yml, .md]
    - root: scripts
      suffixes: [.py]
    - root: apps
      suffixes: [.kit]
  forbidden_path_or_text_regexes:
    - '(?i)single_scene|SingleScene'
    - '(?i)tiled_scene|TiledScene'
    - 'linkerbot_sim\.tiled(?:\.|\b)'
    - 'linkerbot_sim\.physics(?:\.|\b)'
    - 'linkerbot_sim\.(?:app|configs|profiles)(?:\.|\b)'
    - 'linkerbot_sim\.telemetry\.tiled(?:\.|\b)'
    - 'linkerbot_sim\.envs\.config(?:\.|\b)'
    - '(?:^|/)src/linkerbot_sim/(?:app|configs|profiles|physics|tiled)(?:/|$)'
    - '(?:^|/)src/linkerbot_sim/telemetry/tiled(?:/|$)'
    - '(?:^|/)src/linkerbot_sim/envs/config\.py$'
    - '(?:^|/)src/linkerbot_sim/configuration/visualization\.py$'
    - '(?i)newton_direct|DirectNewton'
    - 'linkerbot_sim\.configuration\.loader(?:\.|\b)'
  forbidden_import_prefixes:
    - linkerbot_sim.app
    - linkerbot_sim.configs
    - linkerbot_sim.envs.config
    - linkerbot_sim.physics
    - linkerbot_sim.profiles
    - linkerbot_sim.telemetry.tiled
    - linkerbot_sim.tiled
    - linkerbot_sim.configuration.loader
    - linkerbot_sim.isaac.physics.newton_direct
  historical_documentation_roots:
    - design_plan
    - docs

