schema_version: 2
document_status: target_architecture_final

# v2 清单只描述迁移完成后的事实。逐文件 move/split 的 9175 行历史计划已退出运行时
# 权威；需要恢复迁移前代码时，以这里保留的 S0c commit 和仓库外 checkpoint 为准。
baseline:
  name: S0c
  commit: e111c2d1ebb89c1bcbc996e1f6790b7191661dbe
  captured_at: '2026-07-15T18:06:26+08:00'
  external_checkpoint: <archived off-repo; contact maintainers for the S0c baseline checkpoint>
  production_python_count: 220
  test_python_count: 102

breaking_migration:
  compatibility_shims: forbidden
  products:
    mirror:
      replaces: legacy single-world interactive product
      public_module: linkerbot_sim.mirror
      physics:
        - {engine: physx, execution: cpu}
        - {engine: newton, execution: cpu}
        - {engine: newton, execution: cuda}
      world_count: 1
    kaleidoscope:
      replaces: legacy replicated interactive product
      public_module: linkerbot_sim.kaleidoscope
      physics:
        - {engine: physx, execution: cuda}
        - {engine: newton, execution: cuda}
      gpu_native: true
      viewport: explicit_launch_only
      rendered_world_count: 1
      training_step_render: false
      excluded_capabilities:
        - batch_trajectory_planning
        - collision_avoidance
        - camera
        - synthetic_data
        - replicator
        - recording
        - transport
        - telemetry

required_targets:
  kit_experiences:
    exact:
      - apps/linkerbot_sim.mirror.physx.python.kit
      - apps/linkerbot_sim.mirror.newton.python.kit
      - apps/linkerbot_sim.mirror.newton_render.python.kit
