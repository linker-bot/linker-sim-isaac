[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "linker-lab"
version = "2.0.0"
description = "The Linker LW-v0 workstation for Isaac Lab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/linker_lab/NOTICE"]
authors = [{name = "Ryan Zhou"}]
# The engine is pinned exactly; see src/linker_lab/engine.py for why it differs from
# the Newton version Isaac Lab 3.0 was released with.
dependencies = [
    "isaaclab==3.0.0",
    "newton[sim]==1.8.0",
    "mujoco==3.17.0",
    "mujoco-warp==3.17.0",
    "warp-lang==1.17.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "gymnasium>=1",
    "packaging>=24",
    "pyyaml>=6",
    "scipy>=1.11",
    "trimesh>=4",
    # LW-v0's robot files (data only), from linker-sim-assets at a release tag; converted to
    # USD on first use (linker_lab.assets).
    "linker-lw-v0 @ git+https://github.com/linker-bot/linker-sim-assets@v1.0.0",
    "mujoco-usd-converter==0.9.1",
]

[project.scripts]
linker-lab = "linker_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruckig==0.19.4",
    "ruff>=0.11,<1",
]

[tool.uv]
# Linux with an NVIDIA GPU: x86_64, or aarch64 (e.g. Jetson Thor on JetPack 7).
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Isaac Lab 3.0 requires newton[sim]==1.6.1; replace that requirement with our engine.
override-dependencies = ["newton[sim]==1.8.0"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.hatch.metadata]
allow-direct-references = true  # linker-lw-v0 from git

[tool.hatch.build.targets.wheel]
packages = ["src/linker_lab"]

[tool.hatch.build.targets.wheel.force-include]
"policy-gallery" = "linker_lab/_gallery"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:torch.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Applies linker_lab.bootstrap() before its Isaac Lab imports.
"src/linker_lab/{arm,hand,playground,snapshot,workstation}.py" = ["E402"]
# Gallery entries apply linker_lab.bootstrap() the same way.
"policy-gallery/*/play.py" = ["E402"]
