[build-system]
requires = []
build-backend = "workspace_build"
backend-path = ["."]

[project]
name = "linker-sim-isaac"
version = "0.3.0"
description = "Isaac Sim workspace for robotic manipulation, reality replay, and GPU-parallel reinforcement learning (Mirror and Kaleidoscope)"
requires-python = "==3.12.*"
dependencies = [
  "numpy>=2,<3",
  "PyYAML==6.0.3",
  "scipy==1.17.0",
  "websockets==12.0",
]

[project.optional-dependencies]
# Test tooling is compatible with both the CPU-only and Isaac environments. Keep it
# separate from dev because dev's usd-core must never share an environment with Kit.
test = [
  "coverage==7.4.4",
  "pytest==9.1.1",
]
dev = [
  "coverage==7.4.4",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "ruff==0.16.5",
  # CPU-only USD tests use PyPI USD. Never combine this extra with simulation:
  # Isaac runtime must load pxr from Kit's isaacsim-kernel distribution.
  "usd-core==26.8",
]
visualization = [
  "foxglove-sdk==0.26.0",
]
training = [
  # Gymnasium is deliberately kept at the NumPy process boundary. Native
  # Kaleidoscope and skrl paths exchange CUDA tensors directly.
  "gymnasium==1.3.0",
  "skrl[torch]==2.1.0",
]
simulation = [
  # Core simulator, its offline extension cache, and matching PyTorch release.
  "isaacsim[all,extscache]==6.0.1.0",
  # isaacsim-core pins this release candidate; declaring it directly lets uv
  # admit the exact candidate without enabling unrelated pre-release packages.
  "tinyobjloader==2.0.0rc13",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "torchaudio==2.11.0",
  # GPU memory acceptance reads the simulator process through the official
  # CUDA NVML bindings; keep this a direct dependency instead of relying on
  # cuRobo's transitive CUDA toolchain.
  "cuda-bindings[all]==12.9.7",

  # PyPI's nvidia-curobo 0.1 is an unrelated placeholder package. Pin the
  # immutable v0.8.0 commit. Its cu12 extra selects the cuda-core CUDA 12
  # runtime compilation stack while Torch remains pinned to Isaac's cu128 build.
  "nvidia-curobo[cu12] @ git+https://github.com/NVlabs/curobo.git@4ea77366ca48ee453e7df139e39fa6532af49f3b",

  # Runtime libraries used outside the Kit-managed Python path as well.
  # Isaac Sim 6.0.1's Newton 1.2.1 dependency requires Warp 1.13.x.
  "warp-lang==1.13.0",
]

[tool.uv]
# This is a repository application: runtime profiles and assets live beside src/.
package = false
# dev 与 simulation 互斥：dev 带来 PyPI usd-core，simulation 依赖 Kit 提供的 pxr，
# 两者混装会让 Isaac 运行时从错误来源加载 USD。声明冲突后 uv 会直接拒绝
# `--all-extras` 与 `--extra dev --extra simulation`，把这条约束从文档纪律升级为
# 工具强制，而不是静默混装。
conflicts = [[{ extra = "dev" }, { extra = "simulation" }]]
# NVIDIA publishes Linux Isaac wheels separately from PyPI. Searching both
# trusted indexes is required because the placeholder metadata differs.
index-strategy = "unsafe-best-match"
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["linkerbot_sim"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

# CPU CI cannot import the Isaac/CUDA owners. Its coverage scope is derived from
# architecture/module_disposition.yaml entries whose runtime is explicitly pure.
# The all-source simulation test recipe continues to use tool.coverage.report above.
[tool.linkerbot_sim.coverage]
pure_fail_under = 84

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Keep the accepted lint contract independent from Ruff release defaults. Rule-set
# expansion is a reviewed code-quality change, not an implicit dependency side effect.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/test_system_configs.py" = ["E402"]
"tools/object_assets/*/*/build_asset.py" = ["E402"]

[tool.ruff.format]
# Ruff 0.16 started formatting Markdown code fences by default. Documentation has a
# separate maintained contract; keep this recipe scoped to Python source.
exclude = ["*.md"]
