[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linkerhand-simulation"
version = "0.1.0"
description = "Isaac Sim manipulation utilities for AR5 and LinkerHand L6 experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pyyaml",
  "scipy",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
visualization = [
  "foxglove-sdk",
]
simulation = [
  # Isaac Sim provides the isaacsim, omni, and pxr Python modules used by the runtime scripts.
  "isaacsim[all]==5.1.0.0",
  "cumotion==1.1.0",
  "torch==2.7.0",
]

[tool.setuptools.packages.find]
where = ["source"]

[tool.pytest.ini_options]
pythonpath = ["source"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
