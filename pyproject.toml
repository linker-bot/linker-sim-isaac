[build-system]
requires = []
build-backend = "workspace_build"
backend-path = ["."]

[project]
name = "linkerbot-sim"
version = "0.3.0"
description = "Isaac Sim manipulation utilities for AR5 and LinkerHand L6 experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.0",
  "PyYAML==6.0.2",
  "scipy==1.15.3",
  "websockets==12.0",
]

[project.optional-dependencies]
dev = [
  "coverage==7.4.4",
  "pytest==9.1.1",
  "ruff==0.15.21",
  "usd-core==26.5",
]
visualization = [
  "foxglove-sdk==0.25.2",
]
simulation = [
  # Core simulator, its offline extension cache, and matching PyTorch release.
  "isaacsim[all,extscache]==5.1.0.0",
  "packaging==23.0",
  "torch==2.7.0",
  "torchvision==0.22.0",
  "torchaudio==2.7.0",

  # The published Linux isaacsim-core wheel requires these exact versions;
  # declare them explicitly because index-side metadata is less restrictive.
  "filelock==3.13.1",
  "fsspec==2024.6.1",
  "networkx==3.3",
  # trimesh[easy] otherwise selects chardet>=6, which requests 2.32 rejects.
  "chardet==5.2.0",

  # PyPI's nvidia-curobo 0.1 is an unrelated placeholder package. Pin the
  # immutable v0.8.0 commit; the installed Python import name is `curobo`.
  "nvidia-curobo @ git+https://github.com/NVlabs/curobo.git@4ea77366ca48ee453e7df139e39fa6532af49f3b",

  # cuRobo runtime compilation. Keep the validated CUDA 13 combination
  # instead of using cuRobo's cu12-torch extra.
  "cuda-bindings==13.3.1",
  "cuda-core==1.0.1",

  # Runtime libraries used outside the Kit-managed Python path as well.
  "usd-core==26.5",
  "warp-lang==1.15.0",
]

[tool.uv]
# This is a repository application: runtime profiles and assets live beside src/.
package = false
# NVIDIA publishes Linux Isaac wheels separately from PyPI. Searching both
# trusted indexes is required because the placeholder metadata differs.
index-strategy = "unsafe-best-match"
# Match the dependency metadata embedded in NVIDIA's installed Linux wheel;
# index-side metadata for the same isaacsim-core version pins newer releases.
override-dependencies = [
  "filelock==3.13.1",
  "fsspec==2024.6.1",
  "networkx==3.3",
]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["linkerbot_sim"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/test_system_configs.py" = ["E402"]
"tools/object_assets/*/*/build_asset.py" = ["E402"]
