[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linkerbot-sim"
version = "0.1.0"
description = "Isaac Sim manipulation utilities for AR5 and LinkerHand L6 experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.0",
  "PyYAML==6.0.2",
  "scipy==1.15.3",
  "websockets==12.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]
visualization = [
  "foxglove-sdk==0.25.2",
]
simulation = [
  # Isaac Sim provides the isaacsim, omni, and pxr Python modules used by the runtime scripts.
  "isaacsim[all]==5.1.0.0",
  "cumotion==1.1.0",
  "torch==2.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/test_pinch_grasp_motion_planning.py" = ["E402"]
"tests/test_system_configs.py" = ["E402"]
"tools/object_assets/*/*/build_asset.py" = ["E402"]
