# 桌面场景预留配置。
env:
  name: table_scene
  gravity_z: -9.81
  add_ground: true
  physics_frequency: 400.0
  render_frequency: 100.0

solver:
  # PhysX solver 类型；桌面接触场景默认沿用 TGS。
  type: TGS
  # 对 arm、hand 或两者覆盖迭代次数。
  apply_scope: arm_hand
  arm_position_iterations: 48
  arm_velocity_iterations: 4
  hand_position_iterations: 48
  hand_velocity_iterations: 4

table:
  # 桌面 prim 路径。
  prim_path: /World/Table
  # 桌面尺寸 xyz，单位 m。
  size: [0.8, 0.6, 0.04]
  # 桌面中心位置，单位 m。
  position: [0.35, -0.45, 0.35]
