# scene2: 双 AR5 + L6 桌面运动测试场景。
#
# 本文件描述一个运行场景 profile：
# - env 段配置 Isaac World 级参数，例如重力、地面、物理步频和渲染步频。
# - solver 段只配置 scene 级 PhysX solver 类型。
# - visuals 段配置 GUI 视角和灯光，不影响物理。
# - robots / objects 段只选择已有 profile 并给出 root_pose，资产路径和物理属性不在这里写。
#
# 坐标与单位约定：robot/object root_pose 和固定相机的 /World parent 均使用 world frame；
# xyz / eye / target / clipping_range 单位为米（m），rpy 是 XYZ 欧拉角且单位 rad，
# 物理、渲染和相机采样频率单位均为 Hz。所有 prim path 必须是绝对 USD path。

env:
  # 必填的场景语义标识符；profile 仍由文件名选择，通常保持二者一致便于人工定位。
  name: scene2

  # 可选的人类可读描述，不参与 World、资产或 runtime 行为。
  description: dual arm scripted motion scene

  # 世界重力 z 分量，单位 m/s^2。项目约定 z 轴向上，所以常用负值。
  gravity_z: -9.81

  # 是否添加 Isaac 默认地面。
  # 当前桌面/工装由 object profile 提供接触面，因此关闭默认地面。
  add_ground: false

  # Isaac 默认地面的 z 高度，单位 m；仅在 add_ground 为 true 时生效。
  ground_height: 0.0

  # 绳体接触和抓取对物理步频敏感；较高频率可减小单步穿透并改善约束收敛。
  physics_frequency: 240.0

  # GUI/相机输出的渲染频率，单位 Hz；纯物理 headless 路径可直接跟随 physics_dt。
  render_frequency: 60.0

solver:
  # PhysX scene 级 solver 类型。
  # PGS 成本较低；TGS 对关节链和复杂接触通常更稳定。
  type: PGS

sensors:
  # 仿真传感器摄像机和 GUI viewport 分开配置；camera key 是输出/状态使用的稳定名称。
  # 这里的 parent 为 /World，因此 world_rgbd 是世界坐标系下的固定 RGBD 相机。
  cameras:
    world_rgbd:
      # true 时创建 camera prim、所需 modalities 的 annotator，并按 output 设置消费帧。
      enabled: true
      # prim_path 必须位于 parent_prim_path namespace 下。
      parent_prim_path: /World
      prim_path: /World/WorldRGBD
      # 相对于 /World 的位姿：xyz 单位 m，rpy 为 XYZ 欧拉角，单位 rad。
      pose:
        xyz: [0.08, 0.0, 0.08]
        rpy: [0.0, 1.1, 0.0]
      # resolution 是 [width, height] 像素，采样频率单位 Hz。
      resolution: [640, 480]
      frequency: 30.0
      # 采集 RGB 与深度；裁剪范围为 [near, far]，单位 m。
      modalities: [rgb, depth]
      clipping_range: [0.01, 5.0]
      output:
        # 同一帧可写入离线目录并发布到 Foxglove；live host 仅允许 loopback 地址。
        save_dir: logs/cameras/world_rgbd
        foxglove_topic_prefix: /cameras/world_rgbd
        foxglove_live_host: 127.0.0.1
        foxglove_live_port: 8770
        # foxglove_mcap_path: logs/cameras/world_rgbd.mcap

visuals:
  # GUI 模式下使用的默认 viewport 视角；headless 运行不会触碰 viewport。
  viewport:
    # 是否应用该 GUI viewport 视角配置。
    enabled: true
    # viewport 观察位置，世界坐标 [x, y, z]。
    eye: [1.35, -1.65, 1.05]
    # viewport 观察目标点，世界坐标 [x, y, z]。
    target: [0.0, -0.1, 0.42]
    # Isaac viewport 使用的 camera prim path。
    prim_path: /OmniverseKit_Persp

  # 灯光只影响可视化，不参与物理仿真。
  lights:
    key:
      # 主光，用于照亮机器人和绳体主体。
      enabled: true
      path: /World/KeyLight
      intensity: 1200.0
      # 灯光角度，单位 rad。
      angle: 0.5
    fill:
      # 补光，用于减弱阴影区域的对比。
      enabled: true
      path: /World/FillLight
      intensity: 250.0

robots:
  # label 必须在本场景唯一，是控制、状态与快照的稳定 robot ID；robot_profile 提供
  # 资产、关节和物理/controller 默认值，root_pose 只负责 world 初始摆放。
  - label: left_arm
    robot_profile: ar5v2_l6v1_l
    root_pose:
      xyz: [0.0, 0.09, 0.0]
      rpy: [-1.5707, 0.0, 0.0]
  - label: right_arm
    robot_profile: ar5v2_l6v1_r
    root_pose:
      xyz: [0.0, -0.09, 0.0]
      rpy: [1.5707, 0.0, 0.0]

objects:
  # name 是场景内唯一对象键；object_profile 提供资产/导入/物理，prim_path 与 root_pose
  # 分别定义当前实例的 USD namespace 和 world 初始位姿。
  # workstation 是环境中的固定物体；资产路径、导入参数和物理属性来自 object_profile。
  - name: workstation_armbase
    # 引用 configs/objects/workstation_armbase.yaml。
    object_profile: workstation_armbase
    prim_path: /World/WorkstationArmBase
    # 工装基座在当前场景中的根位姿。
    root_pose:
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]

  # rope 是有语义的动态链式对象；root_pose 属于 scene，资产路径和运行时物理覆盖来自 object_profile。
  # 几何、质量、关节限制等资产固有属性由 tools/object_assets/flexible/rope/config.yaml 生成时决定。
  - name: rope
    # 引用 configs/objects/capsule_rope.yaml。
    object_profile: capsule_rope
    prim_path: /World/CapsuleRope
    # runtime_handle 供脚本按语义名查找该对象，例如双臂动作脚本寻找 rope。
    runtime_handle: rope
    # 绳体在当前双臂测试场景中的初始根位姿。
    root_pose:
      xyz: [0.35, 0, -0.4]
      rpy: [0.0, 0.0, 1.5707]
