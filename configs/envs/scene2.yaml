# scene2: 双 AR5 + L6 桌面运动测试场景。
#
# 本文件描述一个运行场景 profile：
# - env 段配置 Isaac World 级参数，例如重力、地面、物理步频和渲染步频。
# - solver 段只配置 scene 级 PhysX solver 类型。
# - visuals 段配置 GUI 视角和灯光，不影响物理。
# - robots / objects 段只选择已有 profile 并给出 root_pose，资产路径和物理属性不在这里写。
env:
  # 场景语义名称。建议和文件名一致，便于日志和 debug 输出识别。
  name: scene2

  # 场景描述，只用于人工阅读和日志上下文。
  description: dual arm scripted motion scene

  # 世界重力 z 分量，单位 m/s^2。项目约定 z 轴向上，所以常用负值。
  gravity_z: -9.81

  # 是否添加 Isaac 默认地面。
  # 当前桌面/工装由 object profile 提供接触面，因此关闭默认地面。
  add_ground: false

  # 绳体接触和抓取对物理步频敏感，因此默认高于 empty_scene。
  physics_frequency: 240.0

  # GUI 渲染/画面更新频率，单位 Hz；headless 时 runtime 会直接使用 physics_dt。
  render_frequency: 60.0

solver:
  # PhysX scene 级 solver 类型。
  # PGS 成本较低；TGS 对关节链和复杂接触通常更稳定。
  type: PGS

visuals:
  # GUI 模式下使用的默认 viewport 视角；headless 运行不会触碰 viewport。
  camera:
    # 是否应用该相机配置。
    enabled: true
    # 相机位置，世界坐标 [x, y, z]。
    eye: [1.35, -1.65, 1.05]
    # 相机观察目标点，世界坐标 [x, y, z]。
    target: [0.0, -0.1, 0.42]
    # Isaac viewport camera prim path。
    prim_path: /OmniverseKit_Persp

  # 灯光只影响可视化，不参与物理仿真。
  lights:
    key:
      # 主光，用于照亮机器人和绳体主体。
      enabled: true
      path: /World/KeyLight
      intensity: 1200.0
      # 灯光角度，单位 rad。
      angle: 0.5
    fill:
      # 补光，用于减弱阴影区域的对比。
      enabled: true
      path: /World/FillLight
      intensity: 250.0

robots:
  # 双机器人 runtime 使用 dual.left/right；每侧引用一个单 articulation robot profile。
  dual:
    left:
      # 引用 configs/robots/ar5v2_l6v1_l.yaml。
      robot_profile: ar5v2_l6v1_l
      # 左臂在当前场景中的根位姿。
      root_pose:
        # 根节点平移，世界坐标 [x, y, z]，单位 m。
        xyz: [0.0, 0.09, 0.0]
        # 根节点欧拉角 [roll, pitch, yaw]，单位 rad。
        rpy: [-1.5707, 0.0, 0.0]
    right:
      # 引用 configs/robots/ar5v2_l6v1_r.yaml。
      robot_profile: ar5v2_l6v1_r
      # 右臂在当前场景中的根位姿；与左臂在 y 方向相对摆放。
      root_pose:
        # 根节点平移，世界坐标 [x, y, z]，单位 m。
        xyz: [0.0, -0.09, 0.0]
        # 根节点欧拉角 [roll, pitch, yaw]，单位 rad。
        rpy: [1.5707, 0.0, 0.0]

objects:
  # workstation 是环境中的固定物体；资产路径、导入参数和物理属性来自 object_profile。
  - name: workstation_armbase
    # 引用 configs/objects/workstation_armbase.yaml。
    object_profile: workstation_armbase
    # 工装基座在当前场景中的根位姿。
    root_pose:
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]

  # rope 是有语义的动态链式对象；root_pose 属于 scene，资产路径和运行时物理覆盖来自 object_profile。
  # 几何、质量、关节限制等资产固有属性由 tools/assets/configs/capsule_rope.yaml 生成时决定。
  - name: rope
    # 引用 configs/objects/capsule_rope.yaml。
    object_profile: capsule_rope
    # runtime_handle 供脚本按语义名查找该对象，例如双臂动作脚本寻找 rope。
    runtime_handle: rope
    # 绳体在当前双臂测试场景中的初始根位姿。
    root_pose:
      xyz: [0.35, 0, -0.4]
      rpy: [0.0, 0.0, 1.5707]
