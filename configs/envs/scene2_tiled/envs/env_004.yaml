# scene2_tiled 的 env_004 差异片段：只替换 base.yaml 中 rope 的 env-local 初始位姿。
# 未声明的 World、solver、sensor、visual、robot、object 和 clone 字段全部继承 base；
# fragment 不能新增实例。env_id 必须在本 profile 内唯一且位于 [0, tiled.num_envs)。
env_id: 4
objects:
  # 对象名必须引用 base.yaml 已声明实例；root_pose 是完整替换，不逐轴合并。
  rope:
    root_pose:
      # 坐标位于 env-local frame；xyz 单位 m，rpy 为 XYZ 欧拉角且单位 rad。
      xyz: [0.25, -0.02, -0.14]
      rpy: [0.0, -1.57, 0]
metadata:
  # JSON-compatible replay 标签，仅供状态/快照/evaluator 使用，不改变运行行为。
  replay_id: scene2_tiled_004
