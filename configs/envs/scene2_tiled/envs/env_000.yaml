# scene2_tiled 的 env_000 差异片段：只替换 base.yaml 中 rope 的 env-local 初始位姿。
# World、solver、sensor、visual、robot、其它 object 和 clone 设置全部继承上级 base.yaml；
# fragment 不能新增实例或覆盖资产/物理属性。env_id 是加载与排序使用的实际编号，
# 在同一 profile 中必须唯一，并位于 [0, base.yaml:tiled.num_envs) 内。
env_id: 0
objects:
  # key 必须匹配 base.yaml 中 objects[].name；不能在 fragment 中新增对象。
  rope:
    root_pose:
      # root_pose 是完整替换而非逐轴继承；本项目同时写出 xyz/rpy，避免缺项归零。
      # env-local 平移 [x, y, z]，单位 m。
      xyz: [0.25, -0.0, -0.1]
      # env-local XYZ 欧拉角 [roll, pitch, yaw]，单位 rad。
      rpy: [0.0, -1.57, 0]
metadata:
  # 仅携带 status/snapshot/evaluator 可读取的 JSON-compatible 标签，不改变场景构建、
  # 物理、控制或规划行为。
  replay_id: scene2_tiled_000
