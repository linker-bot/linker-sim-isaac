# 环境配置示例。
#
# 本文件用于说明 configs/envs/*.yaml 的字段含义，不作为脚本默认入口。
# 当前脚本默认使用 configs/envs/rope_scene.yaml；需要切换环境时通过：
#
#   --env-config configs/envs/<your_scene>.yaml
#
# 当前实际被脚本读取的核心字段：
# - env.physics_frequency：仿真物理步频，用于换算 physics_dt，也决定控制/轨迹采样节奏。
# - env.render_frequency：GUI 渲染步频；headless 时通常使用 physics_dt。
# - env.gravity_z：世界 z 方向重力。
# - solver.type：physics scene 级 solver 类型，和 arm/hand 字段独立。
# - solver.arm_* / solver.hand_*：机器人刚体 iteration 覆盖；写了哪个字段就覆盖哪个字段。
# - objects[]：已有环境资产进入 stage 的方式，例如 workstation/table。
# - objects[].root_pose：环境物体根 prim 在 world 下的 xyz/rpy 位姿。
# - objects[].import.collision_approximation：URDF 导入时的碰撞 mesh 近似方式。
# - objects[].physics.static：env 决定该物体是否作为固定环境物体。
# - objects[].physics.material：可选 physics material 覆盖；缺省字段不会写入 USD。
#
# 约定/预留字段：
# - env.name：场景语义名称，便于日志、调试和人工识别。
# - env.add_ground：是否添加 Isaac 默认地面；桌面/工装场景可关闭。

env:
  # 场景名称。建议和文件名一致，方便日志和 debug 输出识别。
  name: example_scene

  # 世界重力 z 分量，单位 m/s^2。项目约定 z 轴向上，所以常用负值。
  gravity_z: -9.81

  # 是否需要 Isaac 默认地面。若场景物体已经提供桌面/工装接触面，可设为 false。
  add_ground: true

  # 物理步频，单位 Hz。频率越高，接触和控制越稳定，但计算成本越高。
  physics_frequency: 200.0

  # GUI 渲染步频，单位 Hz。headless smoke 通常不需要高渲染频率。
  render_frequency: 60.0

solver:
  # PhysX solver 类型。TGS 通常更适合关节链、接触和绳体抓取；PGS 成本较低。
  # 这是 scene 级设置，不按 arm/hand 分组。
  type: TGS

  # 机械臂刚体的 position/velocity solver iteration。
  # 只写 arm_position_iterations 时，只覆盖机械臂刚体的 position iteration；
  # 只写 arm_velocity_iterations 时，只覆盖机械臂刚体的 velocity iteration。
  arm_position_iterations: 24
  arm_velocity_iterations: 4

  # 灵巧手刚体的 position/velocity solver iteration。
  # 如果只想调整手部，就只保留 hand_* 字段，删掉 arm_* 字段即可。
  hand_position_iterations: 24
  hand_velocity_iterations: 4

objects:
  # 已有环境资产引用/导入列表。第一版支持 asset_type: urdf 和 usd。
  # root_pose 是资产根 prim 在 world 下的位姿，xyz 单位 m，rpy 单位 rad。
  # physics 只写需要覆盖的字段；缺省字段保持资产或 importer 的原始设置。
  - name: workstation_armbase
    asset_type: urdf
    asset_path: assets/static_env_objects/workstationV1_armbase/workstationV1_armbase.urdf
    prim_path: /World/WorkstationArmBase
    root_pose:
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
    import:
      # URDF/MJCF importer 支持的碰撞 mesh 近似方式。
      # convex_decomposition：把非凸 mesh 分解成多个凸碰撞体，当前项目默认值。
      # convex_hull：为每个 mesh 生成一个凸包，速度快但更粗。
      collision_approximation: convex_decomposition
    physics:
      static: true
      # 可选：只写需要覆盖的材质属性，未填写的属性不会被写入。
      # material:
      #   static_friction: 0.8
      #   dynamic_friction: 0.6
      #   restitution: 0.0
      #   friction_combine_mode: average

  # 如果只需要一种基准 frame，保留对应条目即可。
  - name: workstation_tablebase
    asset_type: urdf
    asset_path: assets/static_env_objects/workstationV1_tablebase/workstationV1_tablebase.urdf
    prim_path: /World/WorkstationTableBase
    root_pose:
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
    import:
      collision_approximation: convex_decomposition
    physics:
      static: true
