# scene_exec_tiled 的 env_000 差异片段：替换已有 Tblock 与 world_rgbd 的 env-local 位姿。
# World、solver、visual、robot、其它 object、相机模板和 clone 参数全部继承 base.yaml；
# fragment 不能新增实例/相机或改变资产、物理、分辨率和输出。该 profile 只有一个 env，
# 因此唯一合法 env_id 为 0。
env_id: 0
objects:
  # key 必须匹配 base.yaml 中 objects[].name；不能在 fragment 中新增对象。
  Tblock:
    root_pose:
      # root_pose 是完整替换，不逐轴继承；env-local xyz 单位 m，rpy 单位 rad。
      xyz: [0.1, 0.0, -0.4]
      rpy: [0.0, 1.5707, 0.6]
cameras:
  # 相机名必须引用 base.yaml 的同名模板，且 env 0 必须包含在模板 env_ids 中。
  world_rgbd:
    pose:
      # 相对展开后 parent prim 的完整局部位姿；xyz 单位 m，rpy 为 XYZ 欧拉角且单位 rad。
      # resolution、frequency、modalities、intrinsics 和 output 均继承 base。
      xyz: [0.08, 0.0, 0.08]
      rpy: [0.0, 1.1, 0.0]
metadata:
  # JSON-compatible opaque 标签，仅供 status/snapshot/evaluator 使用，不改变运行行为。
  replay_id: scene3_tiled_000
