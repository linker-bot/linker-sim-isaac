# 动态对象资产配置示例。
#
# 用途：
# - 描述可生成对象资产本身，例如 capsule rope 的几何、质量、关节和材质参数。
# - env YAML 只负责把已生成资产放进 stage；不要把这些 rope 生成参数写到 env.objects[] 里。
#
# 使用方式：
#   复制本文件为 configs/objects/<your_object>.yaml，修改 object.asset_path 后运行：
#
#     PYTHONPATH=src env_isaaclab/bin/python scripts/build_capsule_rope_asset.py \
#       --config configs/objects/<your_object>.yaml

object:
  # 对象语义名称，建议和输出目录/文件名一致。
  name: example_capsule_rope

  # 生成后的 USD 资产路径。仿真入口引用这个文件，不会每次自动重建。
  asset_path: assets/dynamic_env_objects/capsuleropeV1_default/capsuleropeV1_default.usda

  # 仿真 stage 中引用该资产的 prim path。
  prim_path: /World/ExampleCapsuleRope

  # USD 资产文件内部的默认 prim path。
  root_path: /CapsuleRope

rope:
  # 中间柔性段数量；越多越软、更像绳子，但刚体/关节数量和仿真成本也更高。
  segments: 12

  # 绳体总长度，单位 m。
  length: 0.75

  # 绳段半径，单位 m；null 表示按 length / segments 自动估算。
  radius: null

  # 绳体中心点世界坐标；生成资产时会作为默认摆放参考。
  center: [0.4, -0.55, 0.05]

  # 绳体总质量，内部按 segment 平均分配。
  total_mass: 0.2

  # segment 几何形状：capsule 更适合接触，cuboid 便于调试。
  shape: capsule

  # 两端端块质量和尺寸；抓取目标通常基于端块中心。
  endpoint_box_mass: 0.5
  endpoint_box_size: [0.04, 0.03, 0.1]

  # 端块和中间绳段阻尼。
  endpoint_linear_damping: 0.015
  endpoint_angular_damping: 0.05
  segment_linear_damping: 0.1
  segment_angular_damping: 0.12

  # 相邻段弯曲角限制和弹簧阻尼。
  bend_limit: 2.0943951023931953
  bend_stiffness: 0.1
  bend_damping: 0.1

  # 扭转自由度设置。lock_twist=true 时完全锁住扭转；false 时用 twist_* 做软限制。
  lock_twist: true
  twist_limit: null
  twist_stiffness: 0.1
  twist_damping: 0.05

  # 禁用相邻段碰撞，避免关节连接处自碰抖动。
  disable_adjacent_collisions: true

  # 绳体刚体 solver 迭代次数。
  solver_position_iterations: 48
  solver_velocity_iterations: 4

  # 资产内置的可视材质颜色，RGB 范围通常为 0-1。
  endpoint_color: [0.12, 0.34, 0.95]
  rope_color: [0.78, 0.62, 0.22]

  # 端块碰撞物理材质。
  env_static_friction: 0.7
  env_dynamic_friction: 0.5
  env_restitution: 0.0
