# 运行时对象 profile 示例。
#
# 用途：
# - 描述 linkerbot_sim/src 在导入已有对象资产后需要读取/覆盖的属性。
# - 作为 configs/envs/*.yaml 的 objects[].object_profile 引用目标。
#
# 边界：
# - 本文件不描述对象放在世界哪里；root_pose 放在 env 的 objects[] 中。
# - 本文件不生成对象资产；capsule rope 的几何、段数、质量和关节限制放在
#   tools/object_assets/flexible/rope/config.yaml，生成出的 USD 再由这里引用。
# - rigid 对象可以设置 physics.static 和 import.collision_approximation。
# - dynamic_chain 当前用于 capsule rope，可以设置接触材质和 solver iteration。
#
# rigid 对象 profile 形状示例，实际请参考 workstation_armbase.yaml：
#
# object:
#   name: fixture
#   kind: rigid
#   source: urdf
#   asset_path: assets/rigid_env_objects/workstationV1_armbase/workstationV1_armbase.urdf
#   prim_path: /World/Fixture
#   import:
#     collision_approximation: convex_decomposition
#   physics:
#     static: true
#     material:
#       static_friction: 0.8
#       dynamic_friction: 0.6
#       restitution: 0.0
#       friction_combine_mode: average

object:
  # 对象逻辑名称；env objects[].name 是 scene 中的实例名。
  name: example_capsule_rope

  # 支持 rigid 和 dynamic_chain。
  kind: dynamic_chain

  # 支持 usd 和 urdf。capsule rope 是已经生成好的 USD 资产。
  source: usd
  asset_path: assets/flexible_env_objects/capsuleropeV1_default/capsuleropeV1_default.usda

  # 引用到当前 stage 后的根 prim 路径。
  prim_path: /World/ExampleCapsuleRope

  # USD 资产文件内部的默认 prim 路径；dynamic_chain runtime 用它收集刚体和 joint。
  root_path: /CapsuleRope

  physics:
    # 运行时接触材质覆盖。若省略某个字段，就不覆盖对应 USD 属性。
    material:
      static_friction: 0.7
      dynamic_friction: 0.5
      restitution: 0.0
      friction_combine_mode: average
    # dynamic_chain 刚体 solver iteration 覆盖；适合绳体/端块接触不稳定时调整。
    solver_position_iterations: 48
    solver_velocity_iterations: 4
