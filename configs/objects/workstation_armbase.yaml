# workstation armbase 运行时对象配置。
#
# scene objects[].object_profile 通过文件名 workstation_armbase 选择本 profile；实例 name、
# prim_path 与 root_pose 由 scene 管理。本文件负责可复用的资产导入与运行时物理覆盖。
# 本 profile 没有 planning_collision，因此工装会参与物理接触，但不会自动成为规划障碍物。


object:
  # 资产逻辑名称；scene 按 YAML 文件名选择 profile，场景实例身份使用 objects[].name。
  name: workstation_armbase

  # 对象能力类别。rigid 允许 USD/URDF 导入、static 策略与接触材质覆盖。
  kind: rigid

  # 资产来源类型。这里通过 Isaac URDF importer 导入工装基座。
  source: urdf

  # 工装基座 URDF 路径，相对仓库根目录；stage 目标 prim_path 由 scene 实例提供。
  asset_path: assets/rigid_env_objects/workstationV1_armbase/workstationV1_armbase.urdf

  import:
    # Isaac importer 生成碰撞几何时使用的近似方式。
    # convex_decomposition 更贴合非凸模型；convex_hull 更快但会填平凹陷。
    collision_approximation: convex_decomposition

  physics:
    # true 表示静态工装：URDF 未显式配置 fix_base 时，importer 会固定根基座；
    # 对没有 fixed root 的资产，runtime 才改为 kinematic 并关闭重力，避免重复静态约束。
    static: true

    # 运行时创建并强绑定到工装 collision prim 的接触材质；各系数均无量纲。
    material:
      # 静摩擦系数：影响接触面开始滑动前的摩擦。
      static_friction: 0.8
      # 动摩擦系数：影响已经发生相对滑动后的摩擦。
      dynamic_friction: 0.6
      # 恢复系数：0 表示接触基本不反弹。
      restitution: 0.0

    # PhysX-only leaf 不会投影给 Newton；通用摩擦/恢复系数仍由上方 material 统一提供。
    physx:
      material:
        # 摩擦合成模式；average 表示与接触另一方材质取平均。
        friction_combine_mode: average
