# Capsule rope 对象配置。
# 修改这里的参数后，运行 scripts/build_capsule_rope_asset.py 重新生成
# assets/dynamic_env_objects/capsuleropeV1_default/capsuleropeV1_default.usda；仿真入口只读取生成好的 USD 资产。
object:
  name: capsuleropeV1_default
  # 生成后的 USD 资产路径。
  asset_path: assets/dynamic_env_objects/capsuleropeV1_default/capsuleropeV1_default.usda
  # 仿真 stage 中引用该资产的 prim 路径。
  prim_path: /World/CapsuleRope
  # USD 资产文件内部的默认 prim 路径。
  root_path: /CapsuleRope

rope:
  # 中间柔性段数量；越多越像绳子，但仿真成本越高。
  segments: 18
  # 绳体总长度，单位 m。
  length: 0.75
  # 绳段半径，单位 m；null 表示按 length / segments 自动估算。
  radius: null
  # 绳体中心点世界坐标。
  center: [0.4, -0.55, 0.05]
  # 绳体总质量，内部按 segment 平均分配。
  total_mass: 0.2
  # segment 几何形状：capsule 更适合绳体接触，box 便于调试。
  shape: capsule
  # 两端端块质量和尺寸；抓取目标通常是 endpoint box。
  endpoint_box_mass: 0.5
  endpoint_box_size: [0.04, 0.03, 0.1]
  # 端块和中间绳段刚体阻尼。
  endpoint_linear_damping: 0.015
  endpoint_angular_damping: 0.05
  segment_linear_damping: 0.1
  segment_angular_damping: 0.12
  # 相邻段弯曲角限制和弹簧阻尼。
  bend_limit_deg: 120.0
  bend_stiffness: 0.1
  bend_damping: 0.1
  # 是否完全锁住扭转自由度；false 时用 twist_* 做软限制。
  lock_twist: false
  # 扭转角限制，单位 degree；null 表示按 segments 自动估算。
  twist_limit_deg: null
  twist_stiffness: 0.1
  twist_damping: 0.05
  # 禁用相邻段碰撞，避免关节连接处自碰造成抖动。
  disable_adjacent_collisions: true
  # 绳体刚体 solver 迭代次数。
  solver_position_iterations: 48
  solver_velocity_iterations: 4
  # 资产内置的可视材质颜色，RGB 范围通常为 0-1。
  endpoint_color: [0.12, 0.34, 0.95]
  rope_color: [0.78, 0.62, 0.22]
  # 端块碰撞物理材质。
  env_static_friction: 0.7
  env_dynamic_friction: 0.5
  env_restitution: 0.0
