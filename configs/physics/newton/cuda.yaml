# Mirror/Kaleidoscope 共用的项目自有 Newton CUDA per-world 求解配置。
# 本 leaf 不声明 world_count：Mirror 在 session 投影时固定为 1，Kaleidoscope 从 mode root
# environments 的最终 num_envs 派生，避免同一环境数在 physics leaf 中重复声明。
physics:
  # 判别字段固定选择项目 Newton/MuJoCo-Warp 后端。
  engine: newton
  # solver、状态 tensor 与 world batch 在 mode.compute.cuda_device 指定的 GPU 上执行。
  execution: cuda
  # 以下两个容量按单个 world 计；总预分配还会乘以 mode 的最终 world 数。
  # nconmax 限制同时存在的 contact 数，复杂抓取/堆叠场景需要更高容量。
  nconmax_per_world: 200
  # 约束 Jacobian/求解工作区容量；关节、equality 和接触共同消耗该预算。
  njmax_per_world: 1200
  # 捕获固定 world batch 的 CUDA graph，降低重复 physics step 的 kernel launch 开销。
  use_cuda_graph: true
  # 未显式作者化的接触采用临界阻尼的响应时间（秒），不是关节驱动增益。
  # Newton ke=1/t²、kd=2/t；MuJoCo 正值 solref 仍受 >=2*内部 dt 的 refsafe 约束。
  default_contact_time_constant_s: 0.01
  # 每个子步的主约束求解迭代上限。
  iterations: 100
  # 每次主更新允许的 line-search 迭代上限。
  line_search_iterations: 50
  # 约束求解器：auto/cg/newton；auto 由 runtime 选择当前 CUDA 支持的实现。
  constraint_solver: auto
  # Newton 碰撞 + MuJoCo Warp，CPU/CUDA 共用。资产显式 gap（含0）优先。
  default_contact_gap_m: 0.0001
  # 采用已选候选；后续在相同任务成功率下单独评估性能。
  solver_deterministic: false
  collision_deterministic: true
  contact_matching: disabled
  # Any AR5/O6 assembly activates this policy. Cone/impratio affect the whole scene;
  # other robot materials remain authored. No AR5/O6 means no contact override.
  ar5_o6_contact:
    cone: elliptic
    impratio: 100.0
    solref: [0.004, 1.0]
    friction_gain: 1000.0
    margin_m: 0.0
    restitution: 0.0
    hand:
      friction: [4.0, 0.0, 0.0]
      solimp: [0.95, 0.95, 0.001, 0.5, 2.0]
      condim: 4
    object:
      friction: [1.0, 0.005, 0.0]
      solimp: [0.9, 0.95, 0.001, 0.5, 2.0]
      condim: 4
    station:
      friction: [1.0, 0.0, 0.0]
      solimp: [0.9, 0.95, 0.001, 0.5, 2.0]
      condim: 4
