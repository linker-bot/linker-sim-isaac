# Newton CPU leaf 只声明 CPU 求解器本身的参数。Mirror composition 固定派生一个 world；
# compute.cuda_device 仍由 mode root 唯一声明，供 cuRobo 与 RTX 消费。
physics:
  # 判别字段固定选择项目 Newton/MuJoCo-Warp 后端。
  engine: newton
  # 求解器和模型 buffer 位于 CPU；本 leaf 因此不包含 use_cuda_graph。
  execution: cpu
  # 每个 world 预分配的最大 contact 数；场景越复杂或并行接触越多，所需容量越高。
  nconmax_per_world: 200
  # 每个 world 的约束 Jacobian/求解工作区容量；不足会限制复杂关节与接触约束。
  njmax_per_world: 1200
  # 未显式作者化的接触采用临界阻尼的响应时间（秒），不是关节驱动增益。
  # Newton ke=1/t²、kd=2/t；MuJoCo 正值 solref 仍受 >=2*内部 dt 的 refsafe 约束。
  default_contact_time_constant_s: 0.01
  # 每个子步的主约束求解迭代上限。
  iterations: 100
  # Newton/CG 更新中的 line-search 迭代上限；更高可能改善收敛但提高最坏耗时。
  line_search_iterations: 50
  # 约束求解器：auto/cg/newton；auto 由 runtime 按 execution 和能力选择。
  constraint_solver: auto
  # Newton 碰撞 + MuJoCo Warp，CPU/CUDA 共用。资产显式 gap（含0）优先。
  default_contact_gap_m: 0.0001
  # 采用已选候选；后续在相同任务成功率下单独评估性能。
  solver_deterministic: false
  collision_deterministic: true
  contact_matching: disabled
  # Any AR5/O6 assembly activates this policy. Cone/impratio affect the whole scene;
  # other robot materials remain authored. No AR5/O6 means no contact override.
  ar5_o6_contact:
    cone: elliptic
    impratio: 100.0
    solref: [0.004, 1.0]
    friction_gain: 1000.0
    margin_m: 0.0
    restitution: 0.0
    hand:
      friction: [4.0, 0.0, 0.0]
      solimp: [0.95, 0.95, 0.001, 0.5, 2.0]
      condim: 4
    object:
      friction: [1.0, 0.005, 0.0]
      solimp: [0.9, 0.95, 0.001, 0.5, 2.0]
      condim: 4
    station:
      friction: [1.0, 0.0, 0.0]
      solimp: [0.9, 0.95, 0.001, 0.5, 2.0]
      condim: 4
