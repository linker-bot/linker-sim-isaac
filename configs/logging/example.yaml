# CSV 关节跟踪日志配置示例。
#
# 用途：
# - 控制 single_scene 交互入口运行时是否写 CSV。tiled_scene 启动也会加载并严格校验所选
#   logging profile，但当前不会创建该 CSV logger 或产生此输出。
# - 控制输出路径、flush 周期、采样降频和记录哪些关节列。
#
# 使用方式：
#   复制本文件为 configs/logging/<your_logger>.yaml，然后运行 single_scene 入口时传入 profile 名：
#
#     --logging-profile <your_logger>
#
# 注意：
# - 默认 profile 是 configs/logging/default_logger.yaml。
# - 相对路径以仓库根目录为基准。
# - 命令行仅通过 --logging-profile 选择整份配置；要更换输出路径，请在所选 profile 中
#   设置 joint_tracking_path。
# - 读取 log_measured_effort/log_applied_effort 相对更贵，默认只在分析力矩时打开。
# - 每行固定包含 step/time_s/phase/drive_update，并按 controller.driven_indices 展开逐关节列；
#   记录的是受控主动关节和 Python 驱动的 MJCF follower，不是 articulation 全部 DOF。
# - 多机器人场景把基础路径派生为 <stem>.<robot_id>.<label><suffix>，每个机器人独立输出。
# - 当前 CSV schema 固定使用 rad/rad_s 后缀，适配项目现有旋转 DOF；logger 不读取关节类型，
#   若接入 prismatic DOF，须由消费方按 m/m_s 解读这些列。effort 则旋转为 N*m、直线为 N。


logging:
  # 总开关。false 时仍构造无文件 writer，但不会创建目录或 CSV。
  enabled: true

  # 输出 CSV 基础路径；相对路径以仓库根目录解析，可写绝对路径或 null。
  # null 会关闭文件输出；实际文件名还会追加 robot_id 与机器人实例 label。
  joint_tracking_path: logs/joint_tracking/example.csv

  # 目标 flush 间隔，单位 s，必须为有限正数。runtime 根据 physics_dt 换算后，writer 按该
  # 整数个已写入行 flush；若 interval_steps>1，实际两次 flush 间的仿真时长会同比增加。
  flush_interval_s: 0.2

  # 采样降频，必须为正整数。只在 step % interval_steps == 0 时写行，不改变仿真/控制频率。
  interval_steps: 5

  # 实际关节状态列：q_<joint>_rad、v_<joint>_rad_s；开启后才读取对应 Isaac 状态。
  # 与匹配的 command 列同时开启时，还会生成 command - actual 的 pos_err/vel_err 列。
  log_actual_position: true
  log_actual_velocity: true

  # 控制 target 列：qd_<joint>_rad、vd_<joint>_rad_s 和 tau_cmd_<joint>。
  # tau_cmd 只在 explicit position/velocity 或 direct effort 的主动 DOF 上有值；implicit/follower 为 nan。
  log_command_position: true
  log_command_velocity: true
  log_command_effort: true

  # tau_action_<joint> 记录控制器的 effort action 缓存；当前 explicit/direct 主动 DOF 与
  # tau_cmd 相同，implicit position/velocity 及 follower position action 为 nan。
  log_action_effort: false

  # tau_measured 来自 PhysX solver，tau_applied 来自 Isaac 当前 actuation effort。
  # 两者读取开销更高；接口不可用或读取失败时写 nan，需要分析力矩时再打开。
  log_measured_effort: false
  log_applied_effort: false
