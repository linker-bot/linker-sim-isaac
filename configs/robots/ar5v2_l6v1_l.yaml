# AR5 机械臂 + LinkerHand L6 左手组合配置。
robot:
  name: ar5v2_l6v1_l
  # 组合资产由 AR5 MJCF 和 L6 MJCF merge 得到。
  asset_type: mjcf
  asset_path: assets/combined_system/AR5V2_L6V1_L/AR5V2_L6V1_L.xml
  prim_path: /World/AR5V2_L6V1_L

# 机械臂 7 个主动关节。IK 结果会按这个顺序写回 articulation target。
arm_joints:
  - AR5V2_L_arm_joint_1
  - AR5V2_L_arm_joint_2
  - AR5V2_L_arm_joint_3
  - AR5V2_L_arm_joint_4
  - AR5V2_L_arm_joint_5
  - AR5V2_L_arm_joint_6
  - AR5V2_L_arm_joint_7

# L6 手的 master joints；DIP 等 follower 由 MJCF equality/mimic 映射得到。
hand_master_joints:
  - L6V1_L_hand_thumb_cmc_roll
  - L6V1_L_hand_thumb_cmc_pitch
  - L6V1_L_hand_index_mcp_pitch
  - L6V1_L_hand_middle_mcp_pitch
  - L6V1_L_hand_ring_mcp_pitch
  - L6V1_L_hand_pinky_mcp_pitch

# 运行时显式控制的关节。follower 关节由代码根据 actual master 状态补目标。
controlled_joints:
  - AR5V2_L_arm_joint_1
  - AR5V2_L_arm_joint_2
  - AR5V2_L_arm_joint_3
  - AR5V2_L_arm_joint_4
  - AR5V2_L_arm_joint_5
  - AR5V2_L_arm_joint_6
  - AR5V2_L_arm_joint_7
  - L6V1_L_hand_thumb_cmc_roll
  - L6V1_L_hand_thumb_cmc_pitch
  - L6V1_L_hand_index_mcp_pitch
  - L6V1_L_hand_middle_mcp_pitch
  - L6V1_L_hand_ring_mcp_pitch
  - L6V1_L_hand_pinky_mcp_pitch

ik:
  # 默认使用 cuMotion 求解 AR5 臂的 TCP IK。
  robot_description: assets/single_system/arm/AR5V2_L/AR5V2_L.xrdf
  base_urdf: assets/single_system/arm/AR5V2_L/AR5V2_L.urdf
  flange_frame: AR5V2_L_arm_flan_link

tcp:
  # 默认 TCP 类型；pinch grasp 会在任务里根据闭合手型生成自定义 pinch TCP。
  type: flange
  frame_name: AR5V2_L_arm_flan_link
