# 双机器人 Isaac 执行配置示例。
#
# 用途：
# - robots.left/right 描述仿真中真实导入的两个 articulation。
# - cumotion.left/right 描述规划后端使用的左右单臂模型资源。
# - 运行时可按左右 root_pose 生成缓存双臂 URDF/XRDF。
#
# 使用方式：
#   复制本文件为 configs/robots/<your_dual_robot>.yaml，再替换 name/path/pose。

robots:
  left:
    robot:
      name: example_ar5v2_l6v1_l
      asset_type: mjcf
      asset_path: assets/combined_system/AR5V2_L6V1_L/AR5V2_L6V1_L.xml
      prim_path: /World/ExampleAR5V2_L6V1_L
      import:
        collision_approximation: convex_decomposition
      physics:
        gravity:
          default: false
          arm: false
          hand: false
    root_pose:
      xyz: [0.0, 0.2, 0.5]
      rpy: [-1.5707, 0.0, 0.0]
    # controlled_joints:
    #   - all

  right:
    robot:
      name: example_ar5v2_l6v1_r
      asset_type: mjcf
      asset_path: assets/combined_system/AR5V2_L6V1_R/AR5V2_L6V1_R.xml
      prim_path: /World/ExampleAR5V2_L6V1_R
      import:
        collision_approximation: convex_decomposition
      physics:
        gravity:
          default: false
          arm: false
          hand: false
    root_pose:
      xyz: [0.0, -0.2, 0.5]
      rpy: [1.5707, 0.0, 0.0]
    # controlled_joints:
    #   - all

cumotion:
  left:
    xrdf_path: assets/single_system/arm/AR5V2_L/AR5V2_L.xrdf
    urdf_path: assets/single_system/arm/AR5V2_L/AR5V2_L.urdf
    flange_frame: AR5V2_L_arm_flan_link
  right:
    xrdf_path: assets/single_system/arm/AR5V2_R/AR5V2_R.xrdf
    urdf_path: assets/single_system/arm/AR5V2_R/AR5V2_R.urdf
    flange_frame: AR5V2_R_arm_flan_link

  # 可选：生成双臂 planning model 的输出目录和命名。
  # output_dir: .cache/cumotion
  # robot_name: dual_ar5v2
  # parent_link: world
