# 机器人资产配置示例。
#
# 用途：
# - 描述 Isaac stage 中要导入的真实机器人 articulation。
# - 描述 cuRobo 规划层要加载的机器人模型资源。
#
# 使用方式：
#   复制本文件为 configs/robots/<your_robot>.yaml，再替换 name/path/group names。
#
# 注意：
# - 一份 robot YAML 只描述一个 Isaac articulation。场景实例写在 configs/envs/*.yaml 的
#   robots[] 中；同一 profile 可以被多个具有唯一 label、prim_path 的实例复用。
# - root_pose 的 xyz 使用 m、rpy 使用 rad，属于 env 场景实例，不写在 robot profile。
# - robot.import.collision_approximation 只影响 Isaac importer 生成碰撞几何的方式。
# - robot.import.self_collision 控制 Isaac/PhysX 是否生成机器人 articulation 内部自碰撞接触。
# - robot.physics.physx 是导入后的机器人 USD/PhysX 材料和刚体阻尼覆盖，不属于控制器配置。
# - robot.physics.solver 是机器人刚体 solver iteration 覆盖；scene solver type 写在 env。
# - curobo.robot 段只放模型资源，不放 IK/planner 算法参数；算法参数放 configs/curobo/*.yaml。


robot:
  # 能力类别支持 arm、hand、arm_hand；它决定 joint_groups 约束以及能否启用 arm 规划。
  kind: arm
  # profile 内的机器人逻辑名称，也会作为底层 articulation 的默认 name。
  # 对外寻址使用 env robots[].label/robot_id，不要用此字段区分同 profile 的多个场景实例。
  name: example_ar5v2_l

  # 可选 controller bundle；env robots[].controller_profile 可按实例覆盖。
  # 两者都省略时使用 runtime.profiles.controller_bundle。
  controller_profile: default

  # 支持 mjcf 和 urdf。MJCF 常用于带 mimic/equality 的组合手臂资产。
  asset_type: mjcf

  # 机器人资产路径，可写仓库相对路径或绝对路径；相对路径以仓库根目录为基准。
  asset_path: assets/single_system/arm/AR5V2_L/AR5V2_L.xml

  # Scene 实例路径属于 env robots[].prim_path；robot profile 不固定 stage path。

  # 仅 asset_type: urdf 时可声明 urdf_drive_type: position|none。
  # 当前示例是 MJCF，因此不写这个 URDF 专用字段。

  import:
    # 当前项目暴露的 importer 层碰撞近似方式。
    # convex_decomposition：非凸 mesh 分解为多个凸碰撞体，接触更贴合，成本更高。
    # convex_hull：每个 mesh 一个凸包，更快但会填平凹陷。
    collision_approximation: convex_decomposition
    # 是否开启 Isaac/PhysX articulation 内部 link 之间的自碰撞接触。
    # 默认为 false；开启后可能显著改变手指/机械臂接触行为和求解成本。
    self_collision: false

  physics:
    gravity:
      # 机器人刚体重力策略。false 表示关闭对应刚体重力，true 表示保留重力。
      # default 用于未能按名称分到 arm/hand 的刚体；arm/hand 缺省时继承 default，
      # 此处显式写出三组，便于读者看清每一类刚体的最终策略。
      default: false
      arm: false
      hand: false
    physx:
      # 机器人资产级 USD/PhysX 覆盖；控制器 YAML 只放控制律和 drive 参数。
      # material 整段设为 null（或 preserve）会保留资产已有 material binding。
      material:
        # 摩擦系数与恢复系数均无量纲；显式 material 会绑定到对应 collision prim。
        contact_static_friction: 0.8
        contact_dynamic_friction: 0.6
        contact_restitution: 0.0
        # 可选 average|min|multiply|max；本字段设为 null 时不写 combine mode。若要保留整个
        # 资产 material binding，应把上级 material 整段设为 null 或 preserve。
        friction_combine_mode: average
      rigid_body:
        # 刚体线/角阻尼是 PhysX 资产属性，不是关节 PD damping；单位遵循 USD/PhysX 定义。
        linear_damping: 0.0
        angular_damping: 0.1
    solver:
      # 机器人刚体的 position/velocity solver iteration。
      # 只写某个字段时，只覆盖对应部件的对应 PhysX 属性。
      arm:
        position_iterations: 32
        velocity_iterations: 4
      hand:
        position_iterations: 32
        velocity_iterations: 4

# 可选：控制关节选择。缺省 ["all"] 会先按 articulation.dof_names 顺序选择全部 DOF；
# 也可按期望的命令向量顺序逐项填写精确 articulation DOF 名。两种方式随后都会剔除
# MJCF equality 或 URDF mimic follower，避免 master/follower 同时接收独立命令。
# controlled_joints:
#   - all

curobo:
  # 是否为本 profile 暴露 cuRobo 规划能力；false 时不得声明 planning_joint_group/robot。
  enabled: true
  # 当前只支持 arm；cuRobo active joints 的名称集合必须与 joint_groups.arm 完全一致，
  # 规划结果再按关节名映射到本项目命令顺序，不依赖两边列表恰好同序。
  planning_joint_group: arm
  robot:
    # cuRobo 规划后端使用 URDF 或完整 cuRobo robot YAML，而不是 Isaac stage 中的 MJCF。
    # 当前示例使用基础 URDF，不声明 collision spheres。
    urdf_path: assets/single_system/arm/AR5V2_L/AR5V2_L.urdf

    # 机械臂法兰 frame，必须存在于 cuRobo 模型中；custom TCP 未写 parent_frame 时以它为父
    # frame。它不会自动成为默认末端。
    flange_frame: AR5V2_L_arm_flan_link

    # 默认 TCP frame。未声明 tool_frames 时必须提供；JSON 请求省略 tcp_frame_name 时使用此值。
    default_tcp_frame: example_tool_tcp

    # 可选：一个或多个自定义 TCP fixed frames。每个 TCP 默认相对 flange_frame，也可以显式写
    # parent_frame 指向其它已存在的 URDF link。xyz 单位为 m，rpy 单位为 rad，语义等同
    # URDF fixed joint 的 origin。运行时 JSON 的 tcp_frame_name 只能选择这些已进入 cuRobo
    # context 的 frame，不会临时创建 TCP；派生 frame 写入缓存 URDF，不修改源文件。
    custom_tcps:
      example_tool_tcp:
        xyz: [0.0, 0.0, 0.0]
        rpy: [0.0, 0.0, 0.0]

    # cuRobo robot YAML，可提供 collision spheres、C-space 和模型侧关节配置。
    robot_config_path: assets/single_system/arm/AR5V2_L/AR5V2_L_curobo.yml
    # true 表示将 robot YAML 中的 collision spheres 加入规划 context，供碰撞查询使用。
    load_collision_spheres: true

joint_groups:
  # 精确名称优先于 arm/hand token 分类，也用于 controller per-joint 参数归一化。
  # 列表定义部件成员，名称必须与 articulation DOF 精确一致。默认 controlled_joints=[all]
  # 时命令/轨迹/日志顺序来自 articulation.dof_names；显式 selector 时来自 selector 顺序。
  arm:
    - AR5V2_L_arm_joint_1
    - AR5V2_L_arm_joint_2
    - AR5V2_L_arm_joint_3
    - AR5V2_L_arm_joint_4
    - AR5V2_L_arm_joint_5
    - AR5V2_L_arm_joint_6
    - AR5V2_L_arm_joint_7
  hand: []

rigid_body_groups:
  # 可选精确刚体组，名称匹配导入后 USD rigid-body prim 的短名称。
  # gravity、solver、contact material 和 damping override 共用该分类；未列出的刚体会先
  # 按名称 token 推断 arm/hand，无法推断时才进入 default。该分类不改变命令空间。
  arm:
    - AR5V2_L_arm_base
    - AR5V2_L_arm_link1
    - AR5V2_L_arm_link2
    - AR5V2_L_arm_link3
    - AR5V2_L_arm_link4
    - AR5V2_L_arm_link5
    - AR5V2_L_arm_link6
    - AR5V2_L_arm_link7
  hand: []
  default: []
