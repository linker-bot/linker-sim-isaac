# AR5V2_L 单独机械臂配置。
#
# 本文件描述一个可复用的“单个 Isaac articulation”机器人 profile：
# - env 的 robots[].robot_profile 选择本文件；robots[].label、prim_path、root_pose 决定
#   场景实例的身份、USD 挂载位置和世界位姿，同一 profile 可由多个实例复用。
# - robot 段负责 Isaac/PhysX 侧的资产导入、碰撞近似和导入后的物理覆盖。
# - curobo 段只声明该 articulation 的规划能力及 cuRobo 机器人模型资源。
# - joint_groups 定义 Isaac 命令关节成员，并与 cuRobo active joints 校验名称集合；
#   向量顺序来自 articulation/显式 selector，规划结果按名称映射。
#
# 注意：
# - 这里不写机器人在场景中的 root_pose；root_pose 属于 configs/envs/*.yaml。
# - 这里不写 IK、planner、轨迹优化等算法参数；这些由 configs/curobo/*.yaml 管理。
# - 本 profile 只导入机械臂本体，不包含 LinkerHand 灵巧手。

robot:
  # 能力类别：arm 要求 joint_groups.arm 非空，并允许把 arm 绑定为 cuRobo 规划组。
  kind: arm
  # profile 内的资产逻辑名称。正式 env 装配会使用 robots[].label 作为 articulation 实例名；
  # 日志、registry 和外部寻址也使用实例 label/robot_id，profile 则按文件名选择。
  name: ar5v2_l

  # 资产类型。
  # 当前项目支持 mjcf 和 urdf；这里使用机械臂 MJCF 资产。
  asset_type: mjcf

  # 机器人资产路径，相对仓库根目录。
  # 该文件只包含 AR5V2_L 机械臂，不包含手部模型。
  asset_path: assets/single_system/arm/AR5V2_L/AR5V2_L.xml

  import:
    # Isaac importer 生成碰撞几何时使用的近似方式。
    # convex_decomposition：把非凸 mesh 分解成多个凸碰撞体，接触形状更贴近原模型，计算成本更高。
    # convex_hull：每个 mesh 生成一个凸包，速度更快，但会填平凹陷。
    collision_approximation: convex_decomposition
    # 是否开启 Isaac/PhysX articulation 内部 link 之间的自碰撞接触。
    # 默认保持关闭，避免改变现有机械臂仿真稳定性和成本。
    self_collision: false

  physics:
    # 机器人刚体重力策略。
    # false 表示给对应刚体写入 disableGravity=True，即关闭重力；true 表示保留重力。
    # default 用于未能按名称识别到 arm/hand 的刚体；本 profile 主要使用 arm 分组。
    gravity:
      default: false
      arm: false
      hand: false

    physx:
      # 导入后写到机器人 USD/PhysX 上的资产级物理覆盖。
      # 这些参数不属于控制器配置；它们影响接触、摩擦、反弹和刚体阻尼。
      material:
        # 三个接触参数均为无量纲 PhysX 材料属性，并绑定到机器人 collision prim。
        # 静摩擦系数：影响接触面开始滑动前可承受的切向摩擦。
        contact_static_friction: 0.8
        # 动摩擦系数：影响物体已经发生相对滑动后的摩擦。
        contact_dynamic_friction: 0.6
        # 恢复系数：0 表示接触基本不反弹。
        contact_restitution: 0.0

      rigid_body:
        # 线速度阻尼：0 表示不额外衰减线速度，由原资产和仿真默认值决定。
        linear_damping: 0.0
        # 角速度阻尼：适度抑制旋转抖动。
        angular_damping: 0.1

    solver:
      # 机器人刚体的 PhysX solver iteration 覆盖。
      # position_iterations 主要影响位置约束、接触穿透修正和关节约束收敛。
      # velocity_iterations 主要影响速度约束、摩擦和碰撞后的速度收敛。
      arm:
        # 机械臂刚体的位置约束求解迭代次数。
        position_iterations: 32
        # 机械臂刚体的速度约束求解迭代次数。
        velocity_iterations: 4

curobo:
  # true 表示运行时可为该机器人创建 cuRobo context；不代表每次动作都必须走规划器。
  enabled: true
  # 规划关节组固定引用下方 joint_groups.arm；context 建立后会校验 cuRobo active joints
  # 与该组的名称集合精确一致，具体向量再按关节名映射，避免静默错位。
  planning_joint_group: arm
  robot:
    # cuRobo 规划后端使用的模型资源。
    # IK/planner 等算法参数由 configs/curobo/*.yaml 提供，不放在本文件。

    # URDF 描述机械臂运动学树；robot_config_path 补充 cuRobo collision spheres 与 C-space 参数。
    urdf_path: assets/single_system/arm/AR5V2_L/AR5V2_L.urdf

    # 机械臂法兰 frame，必须存在于 cuRobo 模型中；custom TCP 未写 parent_frame 时以它为父
    # frame。它不会自动成为默认末端，默认末端由 default_tcp_frame/tool_frames 明确指定。
    flange_frame: AR5V2_L_arm_flan_link

    # 默认 TCP frame；未声明 tool_frames 时必须提供。运行时 JSON 中的 tcp_frame_name 只负责
    # 在已加载 frame 中选择，省略时使用此值。
    default_tcp_frame: AR5V2_L_tool_tcp

    # 自定义 TCP fixed frames；未写 parent_frame 时相对 flange_frame。
    # xyz 单位为 m，rpy 单位为 rad，采用 URDF fixed joint 的父 frame -> TCP 位姿语义；
    # 创建 cuRobo context 前会把这些 frame 写入缓存中的派生 URDF，不修改源资产。
    custom_tcps:
      AR5V2_L_tool_tcp:
        xyz: [0.0, 0.0, 0.0]
        rpy: [0.0, 0.0, 0.0]

    # cuRobo robot YAML，定义 collision spheres、C-space 和模型侧关节信息。
    robot_config_path: assets/single_system/arm/AR5V2_L/AR5V2_L_curobo.yml
    # true 表示规划 context 加载上述 robot YAML 中的 collision spheres，供碰撞查询使用。
    load_collision_spheres: true

joint_groups:
  # 名称必须与导入后 articulation 的 DOF 名精确一致。
  # 列表定义 arm 成员；默认 controlled_joints=[all] 时命令顺序来自 articulation.dof_names。
  # 启用 cuRobo 时，arm 名称集合必须与其 active joints 一致。
  arm:
    - AR5V2_L_arm_joint_1
    - AR5V2_L_arm_joint_2
    - AR5V2_L_arm_joint_3
    - AR5V2_L_arm_joint_4
    - AR5V2_L_arm_joint_5
    - AR5V2_L_arm_joint_6
    - AR5V2_L_arm_joint_7
  # 纯机械臂 profile 没有 hand 命令关节；显式空列表同时声明该能力边界。
  hand: []
