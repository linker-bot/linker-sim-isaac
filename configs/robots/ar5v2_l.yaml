# 单独 AR5 机械臂配置。
robot:
  # Isaac 场景中的机器人名称。
  name: ar5v2_l
  # 当前默认使用 MJCF 资产导入；也可扩展为 urdf。
  asset_type: mjcf
  # 机器人资产路径，相对仓库根目录。
  asset_path: assets/single_system/arm/AR5V2_L/AR5V2_L.xml
  # 导入到 USD stage 的根 prim 路径。
  prim_path: /World/AR5V2_L

# 控制器实际下发目标的关节。单臂配置只包含 7 个 AR5 关节。
controlled_joints:
  - AR5V2_L_arm_joint_1
  - AR5V2_L_arm_joint_2
  - AR5V2_L_arm_joint_3
  - AR5V2_L_arm_joint_4
  - AR5V2_L_arm_joint_5
  - AR5V2_L_arm_joint_6
  - AR5V2_L_arm_joint_7

ik:
  # cuMotion XRDF，描述 C-space、默认关节和工具 frame。
  robot_description: assets/single_system/arm/AR5V2_L/AR5V2_L.xrdf
  # 基础 URDF。任务会临时复制并追加 TCP link。
  base_urdf: assets/single_system/arm/AR5V2_L/AR5V2_L.urdf
  # AR5 法兰 link；pinch TCP 会固定在这个 parent frame 下。
  flange_frame: AR5V2_L_arm_flan_link
