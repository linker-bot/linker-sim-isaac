# 双臂双手 Isaac 执行配置。
#
# 这份 YAML 只描述和具体机器人资产/安装位姿绑定的配置：
#
# - robots：Isaac 执行层。left/right 是真实导入 stage 并下发控制命令的两个 articulation。
# - cumotion：cuMotion 规划层。描述规划后端使用的单臂 URDF/XRDF，并在运行时按 robots
#   的 root_pose 生成缓存的双臂 14-DOF URDF/XRDF。
#
# 双臂动作/规划语义，例如 arm_joints、tcp_frame 和 combined_mjcf_path，放在
# configs/dual_arm/ar5v2_l6v1_dual.yaml。

# Isaac 执行层：每一侧都会被单独导入为一个 articulation。这里的姿态决定仿真里真实机器人
# 长什么样、放在哪里。未写 controlled_joints 时，控制器默认选择全部主动 DOF，并自动剔除
# MJCF mimic/equality follower 关节。
robots:
  left:
    robot:
      name: ar5v2_l6v1_l
      asset_type: mjcf
      asset_path: assets/combined_system/AR5V2_L6V1_L/AR5V2_L6V1_L.xml
      prim_path: /World/AR5V2_L6V1_L
      import:
        collision_approximation: convex_decomposition
      physics:
        gravity:
          default: false
          arm: false
          hand: false
    root_pose:
      xyz: [0, 0.2, 0.5]
      rpy: [-1.5707, 0.0, 0.0]

  right:
    robot:
      name: ar5v2_l6v1_r
      asset_type: mjcf
      asset_path: assets/combined_system/AR5V2_L6V1_R/AR5V2_L6V1_R.xml
      prim_path: /World/AR5V2_L6V1_R
      import:
        collision_approximation: convex_decomposition
      physics:
        gravity:
          default: false
          arm: false
          hand: false
    root_pose:
      xyz: [0, -0.2, 0.5]
      rpy: [1.5707, 0.0, 0.0]

# cuMotion 资源层：这里不是 Isaac stage 中的真实 articulation，而是规划后端的机器人描述。
# 双臂配置写成 left/right 两份单臂资源；加载时会按 robots.left/right.root_pose 生成缓存的
# 双臂 URDF，并融合左右 XRDF 成 14-DOF planning model。IK/planner 等算法参数由
# configs/cumotion/*.yaml 提供，这里只写机器人模型资源字段。
cumotion:
  left:
    xrdf_path: assets/single_system/arm/AR5V2_L/AR5V2_L.xrdf
    urdf_path: assets/single_system/arm/AR5V2_L/AR5V2_L.urdf
    flange_frame: AR5V2_L_arm_flan_link
  right:
    xrdf_path: assets/single_system/arm/AR5V2_R/AR5V2_R.xrdf
    urdf_path: assets/single_system/arm/AR5V2_R/AR5V2_R.urdf
    flange_frame: AR5V2_R_arm_flan_link
