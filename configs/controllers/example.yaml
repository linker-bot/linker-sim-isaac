# 控制器 profile 示例。
#
# 用途：
# - 说明 arm_controller.yaml / hand_controller.yaml 的字段含义。
# - 每套配置放在 configs/controllers/<bundle>/ 目录：
#   - arm_controller.yaml
#   - hand_controller.yaml
#   - 可选 default_controller.yaml
# - bundle 按 env instance、robot profile、runtime default 的顺序选择。
#
# 使用方式：
#   新建 configs/controllers/<bundle>/，复制本文件为 arm_controller.yaml 和
#   hand_controller.yaml，再把 target 分别改成 arm/hand。
#
# 消费边界：
# - 本文件位于 controllers 根目录，仅作为模板，不会单独构成可选择的 bundle；运行时按目录
#   同时加载 arm_controller.yaml 与 hand_controller.yaml，可选再加载 default_controller.yaml。
# - position_control 同时提供导入后 USD/PhysX drive seed 与 position 模式运行参数；另外两段
#   只在对应 active control mode 下消费。接触材质、刚体阻尼和 solver 不属于本 schema。
# - active_joints 是上层直接命令的 DOF；follower_joints 由资产 mimic/equality 关系识别，
#   不占 command-space 位置。MJCF follower 由 Python 侧 position drive 执行，URDF mimic
#   由 PhysX 原生约束执行，不会叠加 follower drive。
# - 每个数值可写标量或长度为 1 的列表并广播，也可写与目标关节顺序等长的列表，或覆盖
#   全部精确 DOF 名的 mapping。其它列表长度和不完整的 name-map 都会被拒绝。
# - revolute 的位置/速度/effort 使用 rad、rad/s、N*m；prismatic 使用 m、m/s、N。


# 必填：当前 profile 面向哪个部件。加载器校验文件角色与 target 一致，防止手臂/手配置互换。
target: arm

position_control:
  # 位置控制模式：
  # - implicit：使用 Isaac/PhysX drive。
  # - explicit：Python 侧计算 stiffness * 位置误差 + damping * 速度误差，并下发 effort。
  method: implicit

  active_joints:
    # stiffness/damping 用于 implicit drive 或显式 PD；旋转关节单位分别为
    # N*m/rad、N*m*s/rad，直线关节单位分别为 N/m、N*s/m。
    stiffness: 100.0
    damping: 50.0
    # max_force 用作 drive/显式 effort 的绝对限幅；旋转关节为 N*m，直线关节为 N。
    max_force: 100.0
    # joint_friction 写入 PhysX joint 属性；MJCF frictionloss 会覆盖同名关节。
    joint_friction: 0.5

  follower_joints:
    # MJCF equality follower 不作为独立命令关节，由 runtime position drive 跟随 master 实际状态。
    # URDF mimic 由 PhysX 原生约束执行，不会叠加这里的 follower drive。
    stiffness: 1000.0
    damping: 50.0
    max_force: 100.0
    joint_friction: 0.5

velocity_control:
  # 速度控制模式：
  # - implicit：使用 Isaac velocity drive。
  # - explicit：Python 侧计算 damping * 速度残差。
  method: explicit

  active_joints:
    # 速度控制主动关节不使用 stiffness；damping 把速度误差映射为 effort 或作为 velocity drive 增益。
    damping: 20.0
    max_force: 100.0

  follower_joints:
    # follower 语义不随主动模式切换，仍然是 position drive，因此需要 stiffness/damping/max_force。
    stiffness: 1000.0
    damping: 20.0
    max_force: 100.0
    joint_friction: 0.5

effort_control:
  # effort 控制当前只支持 direct：不使用 PD 增益，只下发经 effort_limit 对称限幅的命令。
  method: direct

  active_joints:
    # direct effort 只需要 effort_limit；范围为 [-effort_limit, effort_limit]，
    # 旋转关节单位 N*m，直线关节单位 N。
    effort_limit: 100.0

  follower_joints:
    # follower 不接收 direct effort，仍由 position drive 维护 mimic 关系。
    stiffness: 1000.0
    damping: 20.0
    max_force: 100.0
    joint_friction: 0.5
