# 差分 IK 控制器配置。
# 目前主要作为后续在线 TCP 伺服的预留配置；脚本入口会按 controller.type 选择对应控制器。
controller:
  # 控制器类型标识，保持为 differential_ik 方便工厂函数/CLI 做分支。
  type: differential_ik
  # TCP 位置误差收敛阈值，单位 m。
  position_tolerance: 0.001
  # TCP 姿态误差收敛阈值，通常以弧度量级解释。
  orientation_tolerance: 0.001
  # 单个 IK 目标最多迭代次数。
  max_iterations: 200
