# 灵巧手控制器、材料和刚体参数。
target: hand

position_control:
  # 灵巧手位置控制参数
  # method=implicit 使用 Isaac/PhysX drive
  # method=explicit 在 Python 侧计算 PD effort
  method: implicit
  # 主动关节参数：
  # stiffness/damping 用于 implicit drive 或显式 PD
  # max_force 用作 drive/effort 限幅
  active_joints:
    stiffness: 1000.0
    damping: 50.0
    max_force: 100.0
    joint_friction: 0.5
  # 从动关节参数：无论主动模式是什么，从动关节都用 Isaac position drive 跟随 master 实际角度。
  # L6 的 DIP 等 mimic follower 通常需要比主动关节更硬的 drive，才能贴近 MJCF equality 关系。
  follower_joints:
    stiffness: 50000.0
    damping: 50.0
    max_force: 100.0
    joint_friction: 0.5

velocity_control:
  # 灵巧手速度控制参数
  # method=implicit 使用 Isaac velocity drive
  # method=explicit 计算 damping * 速度残差
  method: explicit
  # 主动关节速度控制不使用 stiffness；damping 是速度残差到 effort 的比例，max_force 是限幅。
  active_joints:
    damping: 20.0
    max_force: 100.0
  # 从动关节仍然是 position drive，所以必须保留 stiffness/damping/max_force，而不是 effort_limit。
  follower_joints:
    stiffness: 50000.0
    damping: 40.0
    max_force: 100.0
    joint_friction: 0.5

effort_control:
  # 灵巧手 effort 控制参数。method=direct 表示直接把 effort command 下发给 Isaac。
  method: direct
  # 主动关节 direct effort 只需要 effort_limit；调用方给出的 effort 会按该值对称限幅。
  active_joints:
    effort_limit: 100.0
  # 从动关节不接收 direct effort，仍然是 position drive，所以这里配置 drive 增益和 max_force。
  follower_joints:
    stiffness: 50000.0
    damping: 40.0
    max_force: 100.0
    joint_friction: 0.5

physx:
  material:
    contact_static_friction: 0.8
    contact_dynamic_friction: 0.6
    contact_restitution: 0.0
  rigid_body:
    linear_damping: 0.0
    angular_damping: 0.1
