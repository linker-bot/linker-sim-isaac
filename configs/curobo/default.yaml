# cuRobo 默认 profile。
#
# runtime profile 通过 profiles.curobo 引用本文件，启动校验器将它与每个机器人 profile
# 的 curobo.robot 模型资源合并，再由 CuroboContext 创建 IK 或 MotionPlanner。
# 本文件只保存算法、设备和通用 batch 容量；robot_config_path、URDF、TCP frame 等
# 机器人专属资源必须由 configs/robots/*.yaml 的 curobo.robot 段负责。


curobo:
  # 选择项目注册并验证过的整套 IK/trajopt/graph task 模板；不接受任意 task 文件路径。
  task_bundle: curobo_v0_8_default

  # torch tensor 与碰撞计算使用的设备和数据类型。当前四类 dtype 均只允许 float32。
  device:
    # torch 设备字符串；cuda:0 表示第一张 CUDA GPU。该设备需与运行时可见设备相符。
    device: cuda:0
    # 普通运动学/优化 tensor 的标量类型。
    tensor_dtype: float32
    # 碰撞几何、梯度和距离可分别指定类型；拆分字段用于明确 cuRobo 各计算路径，
    # 当前保持一致可避免隐式精度转换和额外显存副本。
    collision_geometry_dtype: float32
    collision_gradient_dtype: float32
    collision_distance_dtype: float32

  # 直接逆运动学求解器；tiled_scene 的同步 IK 也使用这一组参数。
  kinematics:
    ik:
      # 每个 IK problem 送入优化器的 seed 数，必须为正。增加它通常提高找到可行解的
      # 机会，同时按 batch 放大 GPU 计算和显存需求。
      num_seeds: 32
      # 判定末端位置与姿态收敛的误差阈值，单位分别为米和弧度，且不得为负。
      position_tolerance: 0.002
      orientation_tolerance: 0.01
      # CUDA graph 可降低重复求解调度开销，但会固定捕获形状并占用额外显存。
      use_cuda_graph: false
      # 非负随机种子，用于稳定 seed sampling 和优化器初始化，便于复现实验。
      random_seed: 123
      # 障碍物距离小于该值时激活优化器碰撞代价，单位米且不得为负；值越大越保守。
      optimizer_collision_activation_distance: 0.01
      # 保存求解调试轨迹会增加内存占用，并与高性能 CUDA graph 路径互相影响。
      store_debug: false
      # 分别覆盖 particle/L-BFGS 优化器迭代次数；空值表示采用 task bundle 的设置。
      # 非空值必须是非负整数。
      override_optimizer_num_iters:
        particle:
        lbfgs:
      # 多 link/TCP IK 专用迭代次数覆盖；空值沿用各优化器设置，非空值不得为负。
      override_iters_for_multi_link_ik:
      # velocity-aware IK 的时间步，单位秒且必须大于 0；空值使用普通全局 IK，
      # 不启用基于时间步的速度约束与解速度计算。
      optimization_dt:
      # rollout 的速度/加速度正则权重；空值采用 task 模板，非空值必须为非负数。
      velocity_regularization_weight:
      acceleration_regularization_weight:
      # true 要求约束可行且 pose error 达到上述 tolerance；false 只要求约束可行。
      success_requires_convergence: true
      # seed LM 求解器的位置、姿态、速度与加速度误差权重，均不得为负。
      seed_position_weight: 1.0
      seed_orientation_weight: 1.0
      seed_velocity_weight: 0.0
      seed_acceleration_weight: 0.0
      # seed LM 求解器候选数，必须为正；它与最终送入优化器的 num_seeds 不是同一容量。
      seed_solver_num_seeds: 32
      # 可并行求解的 problem 硬上限，必须为正；runtime 的 max_batch_problems 不得超过
      # IK 与 MotionPlanner 两者 max_batch_size 中较小者。提高上限会增加预分配显存。
      max_batch_size: 256
      # 传给 cuRobo 以配置 batched collision env slot。当前项目仍把同一个 SceneCfg 同步给
      # 所有 problem，因此 true 尚不能表达逐 problem 不同障碍物布局；通常保持 false。
      multi_env: false
      # 每个 problem 允许的目标集合容量，必须为正；普通单目标 IK 使用 1。
      max_goalset: 1
      # 是否把机器人自身碰撞纳入约束；关闭可减少计算，但不会检查自碰撞。
      self_collision_check: true
      # cuRobo 场景碰撞缓存按支持的几何类型预分配，值为非负对象数量上限；场景需求
      # 超过容量时规划能力校验会明确失败，不会动态扩容。更大值会占用更多 GPU 内存。
      collision_cache:
        # 项目会将 sphere/capsule 保守包围为 cuboid，因此它们也消耗 cuboid 容量。
        cuboid: 48
        mesh: 4

  # 完整运动规划器：先用 IK 生成目标关节候选，再执行轨迹优化并按需使用图搜索。
  motion_planner:
    # 创建后立即预热 kernel/CUDA graph，降低第一次真实规划的延迟，但增加启动时间，
    # 并可能按最大 batch 形状提前占用显存。
    warmup: true
    # 每个规划 problem 的 IK seed 与轨迹优化 seed 数，均必须为正；增加 seed 会增加
    # 求解时间和显存，且不保证规划质量线性提升。
    num_ik_seeds: 32
    num_trajopt_seeds: 4
    # 规划成功时末端位置/姿态误差阈值，单位米/弧度，且不得为负。
    position_tolerance: 0.002
    orientation_tolerance: 0.01
    # CUDA graph 优化重复规划调度；debug 信息会增加内存并影响该快速路径。
    use_cuda_graph: false
    # 非负随机种子，用于稳定规划器内部 seed 生成。
    random_seed: 123
    # 轨迹优化碰撞代价的激活距离，单位米且不得为负。
    optimizer_collision_activation_distance: 0.01
    store_debug: false
    # BatchMotionPlanner 的并行 problem 上限，必须为正；提高会增加预分配显存。
    max_batch_size: 256
    # batch planner 的 cuRobo multi-env 开关；当前项目仍给所有 problem 同步同一个 SceneCfg，
    # 因此 true 尚不能表达逐 problem 不同障碍物布局；单问题 planner 会强制使用 false。
    multi_env: false
    # 单个 problem 的 goalset 上限，必须为正。
    max_goalset: 1
    # 是否在规划可行性与优化过程中检查机器人自碰撞。
    self_collision_check: true
    # 与 IK 缓存相互独立；MotionPlanner 会按本段容量预分配支持的障碍物类型。
    collision_cache:
      cuboid: 48
      mesh: 4
