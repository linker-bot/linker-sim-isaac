# 平铺多环境交互入口的默认运行时 profile。
# `tiled_scene_interactive.py` 在启动 Isaac/Omni 前读取本文件；配置解析器还会加载
# profiles 引用的环境、cuRobo、日志与控制器配置，并对完整依赖图做启动前校验。
# 本文件只负责进程级行为和资源上限；环境的 num_envs、间距与复制设置属于 env profile。
runtime:
  # 正式运行模式仅允许 single_scene 或 tiled_scene；所选入口必须与此值一致。
  mode: tiled_scene
  # 下列值是 configs 对应目录中的 profile 名，不含目录和扩展名，也不能包含路径分隔符。
  profiles:
    env: scene3_tiled
    curobo: default
    logging: default_logger
    controller_bundle: default

  # Isaac SimulationApp 的进程级启动选项；这些值必须在创建应用前确定。
  simulation_app:
    # false 使用无头模式；true 创建可交互窗口，并采用 gui_size 与 GUI 抗锯齿设置。
    gui: false
    # GPU 编号从 0 开始。active_gpu 和 physics_gpu 都必须小于 max_gpu_count；
    # multi_gpu 仅表达是否请求多 GPU，不会替代实际设备数量检查。
    gpu:
      multi_gpu: false
      max_gpu_count: 1
      active_gpu: 0
      physics_gpu: 0
    # 三组尺寸均按 [宽, 高] 像素填写，且两个分量必须为正整数。
    render:
      gui_size: [1280, 720]
      headless_size: [640, 480]
      window_size: [1440, 900]
      # renderer 直接传给 Isaac；抗锯齿级别必须为非负整数，逐帧采样数必须为正整数。
      renderer: RaytracedLighting
      anti_aliasing_gui: 3
      anti_aliasing_headless: 0
      samples_per_pixel_per_frame: 1
      denoiser: false
      # 下面三个 null 表示交给启动层依据 GUI/无头上下文决定；也可显式填写 true/false。
      hide_ui: null
      disable_viewport_updates: null
      fast_shutdown: null
      # 同步材质加载会改变启动与加载等待开销；仅在确实依赖材质就绪时开启。
      material_sync_loads: false
      hydra_material_sync_loads: false
      # 无头模式下，camera_aware 仅在启用的相机配置了目录、MCAP 或 live 输出消费者时采用
      # render_frequency；physics 始终让渲染步长跟随物理步长。
      headless_dt_policy: camera_aware

  # 控制命令如何转换为 articulation action，以及空闲时是否继续推进物理。
  execution:
    # tiled_scene 当前只实现 position；velocity 与 effort 会在启动前被拒绝。
    control_mode: position
    # idle_physics_policy: pause 完全暂停；hold_step 以指定时长持续步进并保持当前目标。
    idle_physics_policy: pause
    # 单位为秒且必须大于 0；仅在 hold_step 策略下决定空闲步进时长。
    idle_step_duration_s: 0.05
    # 正整数；命令未指定 decimation 时，每次控制更新对应的 physics step 数。
    default_decimation: 2
    # 只补齐交互命令中省略的字段，命令显式值始终优先。
    command_defaults:
      # joint_interpolation: linear | smoothstep。
      joint_interpolation: smoothstep
      # pose_frame: env | world；orientation_mode: free | current | target。
      pose_frame: env
      orientation_mode: current

  # 标准输入、命令记录、快照请求和可选网络协议共同使用的交互资源配置。
  interactive:
    # stdin_eof_policy: exit 在输入结束时退出；keep_alive 继续由网络端点驱动运行。
    stdin_enabled: true
    stdin_eof_policy: exit
    # 命令队列轮询间隔，单位秒且必须大于 0。
    queue_poll_timeout_s: 0.05
    # 以下三项属于共享 schema，tiled_scene 会解析但当前不消费；它们只控制 single_scene
    # 的同步快照请求与命令历史队列。timeout 单位秒且必须大于 0，历史容量可为 0，
    # 快照请求容量必须为正。
    snapshot_timeout_s: 30.0
    command_history_capacity: 256
    snapshot_request_capacity: 32
    transport:
      # TCP JSONL 与 WebSocket 可分别启用。host 只接受回环地址；启用后必须提供
      # 1..65535 的 port，避免配置意外把控制接口暴露到外部网络。
      tcp_jsonl:
        enabled: false
        host: 127.0.0.1
        port: null
      websocket:
        enabled: false
        host: 127.0.0.1
        port: null
      # 单消息字节上限、并发连接数以及请求/事件队列容量都必须为正整数；提高这些值会
      # 增加网络缓冲和内存占用。当前 overflow_policy 只允许 reject。
      max_message_bytes: 1048576
      max_connections: 16
      request_queue_capacity: 256
      event_queue_capacity: 256
      overflow_policy: reject
      # 单位均为秒且必须大于 0，分别控制服务启动、服务端轮询和响应轮询节奏。
      startup_timeout_s: 5.0
      server_poll_interval_s: 0.1
      response_poll_interval_s: 0.5

  # 异步规划后端、请求缺省语义和线程/队列容量；实际机器人模型由 cuRobo profile 合并。
  planner:
    # backend: curobo | linear。linear 不提供碰撞检测，不能与 avoid_collisions=true 联用。
    backend: curobo
    # joint_batch_mode: auto | per_env | batch_only，决定关节目标是否走批量规划路径。
    joint_batch_mode: auto
    # 这些字段仅在请求省略对应值时生效。
    request_defaults:
      # 目标运动时长，单位秒且必须大于 0。
      duration_s: 1.0
      avoid_collisions: false
      # tiled_scene 的每项异步规划会创建隔离 context，因此不能强制刷新共享碰撞世界。
      force_collision_refresh: false
      # coordination 允许的 schema 值为 independent | static_others | coupled；
      # tiled_scene 当前必须使用 independent，且 coupled 在任何模式都尚未实现。
      coordination: independent
      # 成功后是否立即装载轨迹，以及装载时是否替换该环境已有的回放队列。
      load_on_success: true
      replace: true
    # 超出批容量时 split 分批处理或 reject 整体拒绝；failure_policy 可选
    # hold_failed_env（失败环境保持）或 reject_request（整项请求失败）。
    oversize_request_policy: split
    failure_policy: hold_failed_env
    resources:
      # 工作线程、待处理请求和已完成结果缓存的容量。提高前三项会增加 CPU/内存占用；
      # max_completed_results 可为 0，表示不保留完成结果。
      max_workers: 2
      max_pending_requests: 64
      max_completed_results: 256
      # 正整数或 auto；auto 取环境数与所选 cuRobo IK/MotionPlanner 最小 batch 上限的较小值。
      # 解析后的值不能超过该 solver 上限。
      max_batch_problems: 64
      # 单位秒且必须大于 0；关闭时等待规划工作线程退出的上限。
      shutdown_timeout_s: 30.0

  # 每个环境独立计算的轨迹回放防护上限；任一上限超出时当前策略只允许 reject。
  playback:
    max_queue_depth_per_env: 32
    max_samples_per_env: 100000
    # 单位秒；与队列深度、样本数上限一起约束单环境未消费轨迹的内存规模。
    max_duration_s_per_env: 3600.0
    overflow_policy: reject

  # 相机帧异步落盘队列与格式。平铺环境中配额按每个相机输出目录独立计算。
  camera_output:
    # queue_size 必须为正。overflow_policy: block | drop_oldest | drop_newest | error；
    # 需要完整数据集时应使用 block，让生产者背压而不是静默丢帧。
    queue_size: 128
    overflow_policy: block
    # 后台工作线程轮询间隔，单位秒且必须大于 0。
    worker_poll_interval_s: 0.1
    # existing_data_policy: error | truncate | resume | timestamped_dir；若任一相机同时写
    # Foxglove MCAP，则不支持追加，resume 会被拒绝。shutdown_policy 中 drain 会排空
    # 待写帧，abort 会放弃剩余队列。
    existing_data_policy: error
    shutdown_policy: drain
    # rgb_format: ppm | png | npy；depth_format: npy | npz。
    rgb_format: ppm
    depth_format: npy
    # 每处理多少帧刷新一次元数据，正整数；更小更耐异常中断，但写盘频率更高。
    metadata_flush_interval_frames: 1
    # 每个相机输出目录的硬配额，单位字节且必须为正；当前值为 10 GiB。
    max_bytes_per_camera: 10737418240

  # 遥测采样、消息内容与输出 sink。环境选择必须落在 env profile 的 tiled.num_envs 内。
  telemetry:
    # tiled_scene 必须显式声明 primary_env_id 与 selected_env_ids；primary 必须属于选择集合。
    primary_env_id: 0
    selected_env_ids: [0]
    # 正整数；按全局 physics step 进行发布降采样，不改变物理仿真本身的步进频率。
    publish_decimation: 1
    # 目标采样频率（Hz，可为 0）与发布缓冲容量；环境数和缓冲越大，采样开销越高。
    rate_hz: 10.0
    buffer_size: 1
    # drop_policy: latest | drop_oldest | drop_newest；on_error: stop | continue。
    drop_policy: latest
    on_error: stop
    # 至少启用一种消息类型后才能配置 MCAP 或 Foxglove sink。
    include_joint_states: true
    include_state_json: true
    include_scene_markers: true
    # effort 与对象采样会增加每帧读取和序列化开销。
    include_efforts: false
    include_objects: false
    # tiled_scene 不支持 joint_effort_field，因此这里省略该单场景专用字段。
    # 三个 topic 必须是以 / 开头且互不相同的绝对路径。
    topics:
      joint_states: /joint_states
      scene: /scene
      state: /linkerbot/state
    # null 不写 MCAP；非空路径还要求 rate_hz>0 才会创建文件 sink，并受
    # output.mcap_existing_file_policy 控制。
    mcap:
      path: null
    # Foxglove 实时服务仅监听回环地址；enabled=true 时 port 必须为 1..65535。
    foxglove_live:
      enabled: false
      host: 127.0.0.1
      port: null

  # 已存在输出的处理策略。CSV 支持 error | truncate | resume | timestamped_dir；
  # telemetry MCAP 不支持安全追加，因此 mcap_existing_file_policy 不能使用 resume。
  output:
    csv_existing_file_policy: error
    mcap_existing_file_policy: error

  # null 使用缓存目录解析规则；非空相对路径以启动进程 cwd 为基准，路径不得包含 `..`。
  paths:
    cache_root: null

  # 关闭阶段分别等待状态发布器、相机发布器和交互 transport 的时间上限，单位秒且必须为正。
  shutdown:
    state_publisher_timeout_s: 2.0
    camera_publisher_timeout_s: 2.0
    transport_timeout_s: 2.0
