# 完整运行时 profile 示例。
# single_scene/tiled_scene 交互入口会在启动 Isaac/Omni 前读取本文件；配置解析器随后加载
# profiles 引用的环境、cuRobo、日志与控制器配置，并校验完整依赖图。
# 这里只放进程级设置和资源上限；机器人、物体、世界物理与具体请求目标属于各自 profile。

runtime:
  # 正式运行模式：single_scene | tiled_scene；必须与实际启动入口以及 env.tiled.enabled 一致。
  mode: single_scene
  # 对应 configs 下各分组的稳定 profile 名，不含目录和扩展名，也不能包含路径分隔符。
  profiles:
    env: example
    curobo: example
    logging: example
    controller_bundle: default

  # Isaac SimulationApp 的进程级启动选项；这些值必须在创建应用前确定。
  simulation_app:
    # false 使用无头模式；true 创建可交互窗口，并采用 gui_size 与 GUI 抗锯齿设置。
    gui: false
    # GPU 编号从 0 开始；active_gpu 与 physics_gpu 必须小于 max_gpu_count。
    # multi_gpu 仅表达启动意图，不负责探测主机实际设备数量。
    gpu:
      multi_gpu: false
      max_gpu_count: 1
      active_gpu: 0
      physics_gpu: 0
    # 三组尺寸按 [宽, 高] 像素填写，且两个分量都必须为正整数。
    render:
      gui_size: [1280, 720]
      headless_size: [640, 480]
      window_size: [1440, 900]
      # renderer 直接传给 Isaac；抗锯齿级别非负，逐像素逐帧采样数必须为正。
      renderer: RaytracedLighting
      anti_aliasing_gui: 3
      anti_aliasing_headless: 0
      samples_per_pixel_per_frame: 1
      denoiser: false
      # null 表示由启动层依据 GUI/无头上下文决定；也可显式填写 true/false。
      hide_ui: null
      disable_viewport_updates: null
      fast_shutdown: null
      # 同步材质加载会改变启动等待开销；仅在消费方必须等待材质就绪时开启。
      material_sync_loads: false
      hydra_material_sync_loads: false
      # 无头模式下，camera_aware 仅在启用的相机配置了目录、MCAP 或 live 输出消费者时采用
      # render_frequency；physics 始终让渲染步长跟随物理步长。
      headless_dt_policy: camera_aware

  # 控制命令执行与空闲物理步进策略。
  execution:
    # control_mode: position | velocity | effort；tiled_scene 当前仅支持 position。
    control_mode: position
    # idle_physics_policy: pause | hold_step。hold_step 会以指定时长继续物理并保持目标。
    idle_physics_policy: hold_step
    # 单位秒且必须大于 0；hold_step 空闲策略使用该时长继续推进物理。
    idle_step_duration_s: 0.05
    # 正整数；所有模式都会解析校验，当前仅 tiled_scene 在命令未写 decimation 时消费。
    default_decimation: 2
    # JSON 显式字段优先；下列枚举只补齐请求中省略的 command 字段。
    command_defaults:
      # joint_interpolation: linear | smoothstep。
      joint_interpolation: smoothstep
      # pose_frame: env | world；orientation_mode: free | current | target。
      pose_frame: env
      orientation_mode: current

  # 标准输入、命令记录、快照请求和可选网络协议共同使用的交互资源配置。
  interactive:
    # stdin_eof_policy: exit 在 EOF 时退出；keep_alive 继续等待网络输入。
    stdin_enabled: true
    stdin_eof_policy: exit
    # 命令队列轮询间隔，单位秒且必须大于 0。
    queue_poll_timeout_s: 0.05
    # 以下三项仅由 single_scene 的同步快照请求与命令历史队列消费；tiled_scene 只解析。
    # timeout 单位秒且必须大于 0，历史容量可为 0，快照请求容量必须为正。
    snapshot_timeout_s: 30.0
    command_history_capacity: 256
    snapshot_request_capacity: 32
    transport:
      # 两类端点可独立启用；host 只接受回环地址，启用后 port 必须为 1..65535。
      tcp_jsonl: {enabled: false, host: 127.0.0.1, port: null}
      websocket: {enabled: false, host: 127.0.0.1, port: null}
      # 消息、连接及队列容量均为正整数；提高这些值会增加网络缓冲与内存占用。
      max_message_bytes: 1048576
      max_connections: 16
      request_queue_capacity: 256
      event_queue_capacity: 256
      # 当前队列满策略只允许 reject。
      overflow_policy: reject
      # 单位秒且必须大于 0：服务启动、服务端轮询和响应轮询时限。
      startup_timeout_s: 5.0
      server_poll_interval_s: 0.1
      response_poll_interval_s: 0.5

  # 异步规划后端、请求缺省语义和线程/队列容量。
  planner:
    # backend: curobo | linear；linear 没有碰撞检测，不能配 avoid_collisions=true。
    backend: curobo
    # joint_batch_mode: auto | per_env | batch_only；当前仅 tiled_scene 批量规划后端消费。
    joint_batch_mode: auto
    # duration/collision/coordination 等只作为请求缺省值；采样周期从 physics dt 推导。
    request_defaults:
      # duration_s 单位秒且必须大于 0。
      duration_s: 1.0
      avoid_collisions: false
      # force_collision_refresh 在规划前刷新碰撞世界；tiled_scene 不支持此组合。
      force_collision_refresh: false
      # coordination: independent | static_others | coupled；当前 coupled 未实现，
      # tiled_scene 只允许 independent。
      coordination: independent
      # 成功后是否装载轨迹，以及是否替换该环境已有回放队列。
      load_on_success: true
      replace: true
    # 以下两个策略当前仅用于 tiled_scene：超出容量时 split 分批或 reject；失败时
    # hold_failed_env 保持失败环境，reject_request 则拒绝整项请求。
    oversize_request_policy: split
    failure_policy: hold_failed_env
    # 异步批量规划资源当前仅由 tiled_scene 创建和消费；single_scene 仍会严格校验这些字段。
    resources:
      # 工作线程、待处理请求与完成结果缓存；max_completed_results 可为 0。
      max_workers: 2
      max_pending_requests: 64
      max_completed_results: 256
      # auto 取环境数与所选 cuRobo IK/MotionPlanner 最小 batch 上限中的较小值。
      max_batch_problems: auto
      # 单位秒且必须大于 0；关闭时等待规划线程退出的上限。
      shutdown_timeout_s: 30.0

  # tiled_scene 每环境回放队列、总样本数与总时长上限；single_scene 会校验但当前不创建
  # 该回放缓冲区。当前超限策略只允许 reject。
  playback:
    max_queue_depth_per_env: 32
    max_samples_per_env: 100000
    # 单位秒；三项上限共同约束未消费轨迹的内存规模。
    max_duration_s_per_env: 3600.0
    overflow_policy: reject

  # 相机帧异步落盘队列与编码格式，会直接影响内存、CPU 和磁盘占用。
  camera_output:
    # queue_size 必须为正；overflow_policy: block | drop_oldest | drop_newest | error。
    queue_size: 128
    # 数据集输出应使用 block 保持完整；drop_* 只适用于允许丢帧的实时消费。
    overflow_policy: block
    # 后台工作线程轮询间隔，单位秒且必须大于 0。
    worker_poll_interval_s: 0.1
    # existing_data_policy: error | truncate | resume | timestamped_dir；若任一相机同时写
    # Foxglove MCAP，则不支持追加，resume 会被拒绝。shutdown_policy 中 drain 会排空
    # 待写帧，abort 会放弃剩余队列。
    existing_data_policy: error
    shutdown_policy: drain
    # rgb_format: ppm | png | npy；depth_format: npy | npz。
    rgb_format: png
    depth_format: npz
    # 正整数；元数据刷新越频繁，异常中断损失越小，但磁盘写入次数越多。
    metadata_flush_interval_frames: 16
    # 每个相机目录的硬配额，单位字节且必须为正；当前值为 10 GiB。
    max_bytes_per_camera: 10737418240

  # 遥测采样、消息内容和输出 sink。
  telemetry:
    # 非负环境编号；single_scene 会解析但忽略，tiled_scene 要求它属于 selected_env_ids。
    primary_env_id: 0
    # 以下两项仅用于 tiled_scene：选择发布环境，并按全局 physics step 降采样；
    # tiled_scene profile 必须显式提供 selected_env_ids，且所有编号小于 tiled.num_envs。
    # selected_env_ids: [0]
    # publish_decimation: 1
    # 目标采样频率（Hz，可为 0）及正整数缓冲容量。
    rate_hz: 60.0
    buffer_size: 1
    # drop_policy: latest | drop_oldest | drop_newest；on_error: stop | continue。
    drop_policy: latest
    on_error: stop
    # 配置 MCAP/Foxglove sink 时，前三种消息至少启用一种。
    include_joint_states: true
    include_state_json: true
    include_scene_markers: true
    # effort 与对象采样会增加每帧读取和序列化开销；single_scene 输出 scene marker 时
    # 必须 include_objects=true，因为 marker 数据取自运行时对象。
    include_efforts: false
    include_objects: true
    # none | commanded | measured | applied；非 none 时必须 include_efforts=true，且仅
    # single_scene 支持该字段。
    joint_effort_field: none
    # 三个 topic 必须是以 / 开头且互不相同的绝对路径。
    topics: {joint_states: /joint_states, scene: /scene, state: /linkerbot/state}
    # mcap.path=null 不创建文件；非空路径还要求 rate_hz>0 才会创建 MCAP sink。
    # Foxglove live 只监听回环地址，启用后必须提供合法端口。
    mcap: {path: null}
    foxglove_live: {enabled: false, host: 127.0.0.1, port: null}

  # 已存在输出的处理策略。CSV 支持 error | truncate | resume | timestamped_dir；
  # telemetry MCAP 不支持安全追加，因此 mcap_existing_file_policy 不能使用 resume。
  output:
    csv_existing_file_policy: error
    mcap_existing_file_policy: error
  # null 使用内置缓存目录解析顺序；非空相对路径以启动进程 cwd 为基准，且不能包含 `..`。
  paths:
    cache_root: null
  # 关闭阶段等待状态发布器、相机发布器和 transport 的独立上限，单位秒且必须为正。
  shutdown:
    state_publisher_timeout_s: 2.0
    camera_publisher_timeout_s: 2.0
    transport_timeout_s: 2.0
