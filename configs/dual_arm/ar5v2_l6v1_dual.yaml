# AR5V2 + L6V1 双臂语义配置。
#
# 这里不描述 Isaac 导入，也不描述 cuMotion 后端资源；这些分别在 configs/robots 和
# configs/cumotion/robot 配置中维护。本文件只保存双臂动作/规划层需要的语义：
# - arm_joints：融合 C-space 中左右机械臂的关节顺序。
# - flange_frame/tcp_frame：按阶段选择或生成 TCP 时使用的 frame。
# - combined_mjcf_path：从“机械臂+手”的组合资产里推导 pinch TCP。

dual_arm:
  left:
    # 左臂在双臂融合 C-space 中的关节名顺序。
    # 顺序必须与生成的双臂 cuMotion URDF/XRDF C-space 顺序一致。
    arm_joints:
      - AR5V2_L_arm_joint_1
      - AR5V2_L_arm_joint_2
      - AR5V2_L_arm_joint_3
      - AR5V2_L_arm_joint_4
      - AR5V2_L_arm_joint_5
      - AR5V2_L_arm_joint_6
      - AR5V2_L_arm_joint_7

    # 左机械臂法兰 frame，必须存在于左臂 cuMotion URDF 中。
    flange_frame: AR5V2_L_arm_flan_link

    # 动作层使用的左侧 TCP frame 名；pinch TCP 可由脚本临时写入 cuMotion URDF。
    tcp_frame: left_pinch_tcp

    # 左侧“机械臂+灵巧手”组合 MJCF，用于推导 pinch TCP 和手部几何关系。
    combined_mjcf_path: assets/combined_system/AR5V2_L6V1_L/AR5V2_L6V1_L.xml

  right:
    # 右臂在双臂融合 C-space 中的关节名顺序。
    # 顺序必须与生成的双臂 cuMotion URDF/XRDF C-space 顺序一致。
    arm_joints:
      - AR5V2_R_arm_joint_1
      - AR5V2_R_arm_joint_2
      - AR5V2_R_arm_joint_3
      - AR5V2_R_arm_joint_4
      - AR5V2_R_arm_joint_5
      - AR5V2_R_arm_joint_6
      - AR5V2_R_arm_joint_7

    # 右机械臂法兰 frame，必须存在于右臂 cuMotion URDF 中。
    flange_frame: AR5V2_R_arm_flan_link

    # 动作层使用的右侧 TCP frame 名；pinch TCP 可由脚本临时写入 cuMotion URDF。
    tcp_frame: right_pinch_tcp

    # 右侧“机械臂+灵巧手”组合 MJCF，用于推导 pinch TCP 和手部几何关系。
    combined_mjcf_path: assets/combined_system/AR5V2_L6V1_R/AR5V2_L6V1_R.xml
