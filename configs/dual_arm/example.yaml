# 双臂语义配置示例。
#
# 用途：
# - 描述“规划/动作层”如何理解左右臂，而不是描述 Isaac 导入资产。
# - robot YAML 负责真实 articulation 导入和 cuMotion 模型资源。
# - 本文件只放双臂 C-space 分组、法兰/TCP frame、组合 MJCF 查询路径。
#
# 使用方式：
#   复制本文件为 configs/dual_arm/<your_dual_arm>.yaml，再替换关节名和 frame 名。
#
# 注意：
# - 双臂/单臂由 configs/envs/*.yaml 选择：单臂用 robots.single，双臂用 robots.dual.left/right。
# - 每侧 robot_profile 仍然是单 articulation robot YAML；本文件不导入 Isaac 机器人。
# - arm_joints 顺序必须和 cuMotion 双臂 XRDF/URDF 的 C-space 顺序一致。
# - tcp_frame 是动作脚本阶段选择的末端 frame；pinch TCP 可由组合 MJCF 推导并临时写入 URDF。
# - combined_mjcf_path 用于从“机械臂+手”的组合资产中推导手指/夹捏几何关系。

dual_arm:
  left:
    # 左臂在双臂融合 C-space 中的关节名顺序。
    arm_joints:
      - AR5V2_L_arm_joint_1
      - AR5V2_L_arm_joint_2
      - AR5V2_L_arm_joint_3
      - AR5V2_L_arm_joint_4
      - AR5V2_L_arm_joint_5
      - AR5V2_L_arm_joint_6
      - AR5V2_L_arm_joint_7

    # 机械臂法兰 frame，必须存在于左臂 cuMotion URDF 中。
    flange_frame: AR5V2_L_arm_flan_link

    # 动作层使用的左侧 TCP frame 名；可由脚本临时写入 cuMotion URDF。
    tcp_frame: left_pinch_tcp

    # 左侧“机械臂+灵巧手”组合 MJCF，用于推导 pinch TCP 和手部几何关系。
    combined_mjcf_path: assets/combined_system/AR5V2_L6V1_L/AR5V2_L6V1_L.xml

  right:
    # 右臂在双臂融合 C-space 中的关节名顺序。
    arm_joints:
      - AR5V2_R_arm_joint_1
      - AR5V2_R_arm_joint_2
      - AR5V2_R_arm_joint_3
      - AR5V2_R_arm_joint_4
      - AR5V2_R_arm_joint_5
      - AR5V2_R_arm_joint_6
      - AR5V2_R_arm_joint_7

    # 机械臂法兰 frame，必须存在于右臂 cuMotion URDF 中。
    flange_frame: AR5V2_R_arm_flan_link

    # 动作层使用的右侧 TCP frame 名；可由脚本临时写入 cuMotion URDF。
    tcp_frame: right_pinch_tcp

    # 右侧“机械臂+灵巧手”组合 MJCF。
    combined_mjcf_path: assets/combined_system/AR5V2_L6V1_R/AR5V2_L6V1_R.xml
