name: Simulation

on:
  workflow_dispatch:

permissions:
  contents: read

# Do not terminate a live Kit process to make room for a newer revision. GitHub keeps
# at most one pending run in this group while the current trusted run drains normally.
concurrency:
  group: simulation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gpu-simulation:
    name: GPU / LW-v0 simulation
    runs-on: [self-hosted, linux, x64, nvidia-gpu, isaac-sim]
    environment: simulation
    timeout-minutes: 240
    env:
      OMNI_KIT_ACCEPT_EULA: ${{ vars.OMNI_KIT_ACCEPT_EULA }}
      PYTHONUTF8: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize acceptance evidence
        shell: bash
        run: |
          mkdir -p artifacts/simulation
          printf '%s\n' "$GITHUB_SHA" > artifacts/simulation/expected-sha.txt

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify trusted NVIDIA runner
        shell: bash
        run: |
          set -euo pipefail
          {
            test "${OMNI_KIT_ACCEPT_EULA:-}" = Y || {
              echo "::error::Set the simulation environment variable OMNI_KIT_ACCEPT_EULA=Y after reviewing NVIDIA's terms."
              exit 1
            }
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
            command -v nvidia-smi
            nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
          } 2>&1 | tee artifacts/simulation/runner.log

      - name: Verify dependency lock
        run: |
          set -euo pipefail
          uv lock --check 2>&1 | tee artifacts/simulation/lock.log

      - name: Sync simulation test environment
        id: sync
        run: |
          set -euo pipefail
          uv sync --locked --group dev 2>&1 | tee artifacts/simulation/sync.log

      - name: Verify Python and CUDA stack
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY' 2>&1 | tee artifacts/simulation/cuda.log
          import pytest
          import torch

          assert torch.cuda.is_available(), "CUDA is required for simulation CI"
          print(
              {
                  "cuda": torch.version.cuda,
                  "device": torch.cuda.get_device_name(0),
                  "pytest": pytest.__version__,
                  "torch": torch.__version__,
              }
          )
          PY

      - name: Record source and runtime metadata
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          runner_python=python
          if test -x .venv/bin/python; then runner_python=.venv/bin/python; fi
          "$runner_python" scripts/simulation_evidence.py record \
            --expected-sha "$GITHUB_SHA" \
            --sync-outcome "${{ steps.sync.outcome }}" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output artifacts/simulation/metadata.json \
            2>&1 | tee artifacts/simulation/metadata.log

      - name: Run GPU and Isaac acceptance matrix
        run: |
          set -euo pipefail
          {
            test -n "${DISPLAY:-}" || { echo "A display is required for viewer acceptance tests"; exit 1; }
            uv run --no-sync python -m pytest tests/gpu -ra --capture=tee-sys \
              --junitxml=artifacts/simulation/junit.xml -o junit_logging=all \
              --basetemp=artifacts/simulation/pytest-tmp
          } 2>&1 | tee artifacts/simulation/pytest.log

      - name: Require complete GPU acceptance evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          runner_python=python
          if test -x .venv/bin/python; then runner_python=.venv/bin/python; fi
          "$runner_python" scripts/simulation_evidence.py check \
            --expected-sha "$GITHUB_SHA" \
            --metadata artifacts/simulation/metadata.json \
            --junit artifacts/simulation/junit.xml \
            --output artifacts/simulation/acceptance.json \
            2>&1 | tee artifacts/simulation/acceptance.log

      - name: Preserve simulation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/simulation/
          if-no-files-found: error
          retention-days: 30
