name: Quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-quality:
    name: CPU quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      UV_NO_PROGRESS: "1"
      UV_PROJECT_ENVIRONMENT: .venv-dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # linker-robot-assets is a submodule; validate-config parses the
          # composed workstation.urdf and test-pure reads workstation.xml from
          # it. No LFS meshes are needed for the CPU gate (XML/text only).
          submodules: recursive

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Verify dependency lock
        run: uv lock --check

      - name: Sync CPU development environment
        run: uv sync --frozen --extra dev

      - name: Run CPU quality gate
        run: just quality
