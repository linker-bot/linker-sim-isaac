name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-quality:
    name: CPU quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      UV_NO_PROGRESS: "1"
      UV_PROJECT_ENVIRONMENT: .venv-dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify dependency lock
        run: uv lock --check

      - name: Sync CPU development environment
        run: uv sync --locked --group dev

      - name: Install wheel build test dependency
        run: uv pip install --python .venv-dev/bin/python "hatchling>=1.27,<2"

      - name: Verify installed wheel resources
        run: uv run --no-sync python -m pytest tests/distribution --confcutdir=tests/distribution

      - name: Run CPU quality gate
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync python -m pytest tests --ignore=tests/gpu --ignore=tests/distribution
