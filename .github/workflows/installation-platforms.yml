name: Installation platforms

on:
  pull_request:
    paths:
      - .github/workflows/installation-platforms.yml
      - install.sh
      - pyproject.toml
      - uv.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/installation-platforms.yml
      - install.sh
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installation-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-platform:
    name: Runtime dependencies / ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64-manylinux_2_35, aarch64-manylinux_2_35]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"

      - name: Check the locked runtime at the minimum glibc version
        run: uv sync --locked --no-dev --dry-run --python-platform "${{ matrix.platform }}"
