version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 6
    groups:
      # Isaac Sim, Torch, Warp, CUDA, and cuRobo form one validated ABI/runtime
      # closure. Review and exercise their upgrades together instead of merging
      # individually green-looking lock changes.
      simulation-runtime:
        patterns:
          - "isaacsim*"
          - "torch"
          - "torchvision"
          - "torchaudio"
          - "warp-lang"
          - "cuda-bindings"
          - "nvidia-curobo"
          - "newton*"
          - "mujoco-warp"
          - "tinyobjloader"
      development-tooling:
        patterns:
          - "coverage"
          - "pyright"
          - "pytest"
          - "ruff"
          - "usd-core"
      application-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      workflow-actions:
        patterns:
          - "*"
